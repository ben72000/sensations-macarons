<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sensations Macarons — Pilotage</title>
<meta name="theme-color" content="#52252F">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sensations">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bordeaux:#52252F; --bordeaux-2:#6e3340; --creme:#E8DDCD; --creme-2:#F5F0E8;
  --caramel:#AA7C39; --caramel-2:#c6974f; --ink:#2b1a1f; --paper:#fbf8f3;
  --green:#3f7d52; --red:#b04a3e; --shadow:rgba(82,37,47,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Outfit','Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  background-image:radial-gradient(circle at 12% 18%,rgba(170,124,57,.06),transparent 40%),radial-gradient(circle at 88% 82%,rgba(82,37,47,.05),transparent 45%);
  -webkit-font-smoothing:antialiased;}
h1,h2,h3,.serif{font-family:'Fraunces','Georgia',serif}
.app{display:flex;min-height:100vh;width:100%;overflow-x:hidden}
.side{width:230px;background:linear-gradient(180deg,var(--bordeaux),var(--bordeaux-2));
  color:var(--creme);padding:26px 16px;position:fixed;height:100vh;display:flex;flex-direction:column;gap:4px;z-index:10}
.brand{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:600;line-height:1.15;margin-bottom:4px}
.brand small{display:block;font-family:'Outfit';font-size:.62rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--caramel-2);margin-top:6px;font-weight:500}
.brand-rule{height:1px;background:rgba(232,221,205,.25);margin:16px 0}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav button{appearance:none;-webkit-appearance:none;background:transparent;border:none;margin:0;
  font-family:inherit;text-align:left;width:100%;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 14px;
  border-radius:11px;font-size:.9rem;color:var(--creme);transition:.18s;font-weight:400;-webkit-tap-highlight-color:transparent}
.nav button *{pointer-events:none}
.nav button:hover{background:rgba(232,221,205,.1)}
.nav button.active{background:var(--creme);color:var(--bordeaux);font-weight:600}
.nav .ico{font-size:1.02rem;width:20px;text-align:center}
.nav .sep{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(232,221,205,.4);padding:12px 14px 4px;font-weight:600}
.side-foot{font-size:.66rem;color:rgba(232,221,205,.55);line-height:1.5;margin-top:8px}
.side-foot .foot-help{display:block;margin-bottom:8px}
.side-foot .foot-btn{width:100%;margin-top:6px}
.main{margin-left:230px;flex:1;min-width:0;max-width:calc(100% - 230px);padding:32px 38px 60px;overflow-x:hidden}
@keyframes viewIn{ from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.main.view-in{ animation:viewIn .22s ease-out }
@media (prefers-reduced-motion: reduce){ .main.view-in{ animation:none } }
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap;gap:12px}
.topbar h1{font-size:1.9rem;font-weight:600;color:var(--bordeaux)}
.topbar p{color:#8a7a72;font-size:.9rem;margin-top:2px}
.btn{appearance:none;-webkit-appearance:none;border:none;margin:0;font-family:'Outfit';cursor:pointer;
  background:var(--bordeaux);color:var(--creme);padding:10px 18px;-webkit-tap-highlight-color:transparent;
  border-radius:10px;font-size:.86rem;font-weight:500;transition:.18s;display:inline-flex;gap:7px;align-items:center;text-align:center;justify-content:center}
.btn:hover{background:var(--bordeaux-2);transform:translateY(-1px)}
.btn.gold{background:var(--caramel)}.btn.gold:hover{background:var(--caramel-2)}
.btn.ghost{background:transparent;color:var(--bordeaux);border:1.5px solid var(--bordeaux)}
.btn.danger{background:var(--red,#b0392c);color:#fff}.btn.danger:hover{background:#922e23}
.btn.ghost:hover{background:var(--bordeaux);color:var(--creme)}
.btn.sm{padding:6px 12px;font-size:.78rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:28px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 20px var(--shadow);border:1px solid rgba(170,124,57,.12);position:relative;overflow:hidden}
.card.clickable{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.card.clickable:hover{transform:translateY(-2px);box-shadow:0 8px 26px var(--shadow)}
.card.clickable:active{transform:translateY(0)}
.card .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:#9a8a82;font-weight:500}
.card .val{font-family:'Fraunces',serif;font-size:2rem;font-weight:600;color:var(--bordeaux);margin-top:6px;line-height:1}
.card .sub{font-size:.78rem;color:#9a8a82;margin-top:6px}
.card .corner{position:absolute;top:-12px;right:-12px;font-size:3.2rem;opacity:.08}
.panel{background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px var(--shadow);border:1px solid rgba(170,124,57,.12);margin-bottom:22px;max-width:100%;overflow:hidden}
.panel h2{font-size:1.15rem;color:var(--bordeaux);margin-bottom:16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.table-wrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;display:block;overscroll-behavior-x:contain}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.87rem}
.table-wrap table{min-width:max-content}
/* Première colonne FIGÉE lors du défilement horizontal (type Excel) :
   la colonne d'identification reste visible. Sa largeur est BORNÉE pour ne pas
   manger l'écran ; un texte long s'enroule sur 2 lignes plutôt que d'allonger la colonne. */
.table-wrap th:first-child,
.table-wrap td:first-child{
  position:sticky; left:0; z-index:2;
  background:#fff;
  box-shadow:1px 0 0 #f0eae0;
  max-width:42vw;                 /* ne dépasse jamais ~40% de l'écran */
  white-space:normal;             /* autorise le retour à la ligne */
  overflow-wrap:anywhere;         /* coupe les mots très longs si besoin */
}
.table-wrap thead th:first-child{ z-index:3; background:#fff; }
.table-wrap tr:hover td:first-child{ background:var(--creme-2); }
/* Désactive la colonne figée quand on ne le souhaite pas (classe .no-freeze). */
.table-wrap.no-freeze th:first-child,
.table-wrap.no-freeze td:first-child{ position:static; box-shadow:none; max-width:none; }
th{text-align:left;padding:11px 12px;color:#9a8a82;font-weight:500;font-size:.72rem;
  text-transform:uppercase;letter-spacing:.07em;border-bottom:2px solid var(--creme)}
td{padding:12px;border-bottom:1px solid #f0eae0;vertical-align:top}
tr:hover td{background:var(--creme-2)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.74rem;font-weight:500;white-space:nowrap}
.tag.in{background:#e3f0e7;color:var(--green)}
.tag.out{background:#f6e3e0;color:var(--red)}
.tag.low{background:#fbeede;color:var(--caramel)}
.tag.ok{background:#e3f0e7;color:var(--green)}
.tag.event{background:#efe3f0;color:#7a4b82}
.tag.todo{background:#f6e3e0;color:var(--red)}
.tag.done{background:#e3f0e7;color:var(--green)}
.tag.warn{background:#fbeede;color:var(--caramel)}
.empty{text-align:center;padding:40px;color:#b3a59c;font-style:italic}
.act{cursor:pointer;color:var(--caramel);font-weight:600;font-size:.8rem;margin-right:10px;white-space:nowrap}
.act:hover{text-decoration:underline}.act.del{color:var(--red)}
/* Boutons d'action rapide sur les lignes (mobile-friendly, faciles à toucher) */
.qa{display:inline-flex;align-items:center;gap:3px;padding:5px 9px;margin:2px 3px 2px 0;border:1.5px solid #e0d5c5;border-radius:9px;background:#fff;color:var(--bordeaux);font-size:.76rem;font-weight:600;cursor:pointer;white-space:nowrap;line-height:1}
.qa:active{transform:scale(.96)}
.qa.pay{border-color:#bfe0c8;color:#2e7d32}
.qa.status{border-color:#e4cf9a;color:#9a7b1f}
.qa.edit{border-color:#d9c8e0;color:#7a4b82}
.qa.del{border-color:#f0cfc9;color:var(--red)}
.qa-row{display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end}
.link-name{cursor:pointer;color:var(--bordeaux);border-bottom:1px dotted var(--caramel)}
.link-name:hover{color:var(--caramel)}
.pay-toggle{display:inline-flex;gap:6px;flex-wrap:wrap}
.pay-toggle .pay-opt{display:inline-flex;align-items:center;gap:5px;font-size:.84rem;padding:4px 8px;border:1.5px solid #e0d5c5;border-radius:9px;cursor:pointer;background:#fff}
.pay-toggle .pay-opt input{width:auto;margin:0}
.pay-toggle.sm .pay-opt{font-size:.76rem;padding:3px 6px}
.sel-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fbf4ec;border:1px solid #e8dccd;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:.86rem;font-weight:600;color:var(--bordeaux)}
#updateBanner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);z-index:9999;display:flex;align-items:center;gap:12px;background:var(--bordeaux);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(43,26,31,.35);font-size:.88rem;max-width:92vw}
#updateBanner button{border:none;border-radius:9px;padding:8px 12px;font-family:'Outfit';font-weight:600;cursor:pointer}
#updateBanner #updateReload{background:var(--caramel);color:#fff}
#updateBanner #updateDismiss{background:transparent;color:#fff;opacity:.7;padding:8px 6px}
.mult-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fbf4ec;border:1px solid #e8dccd;border-radius:10px;padding:8px 12px;margin-bottom:12px}
.mult-bar label{font-weight:600;color:var(--bordeaux);font-size:.86rem}
.mult-bar input{width:90px;padding:7px 10px;border:1.5px solid #e0d5c5;border-radius:9px;font-family:'Outfit'}
.pay-ledger{background:#fbf4ec;border:1px solid #e8dccd;border-radius:10px;padding:10px 12px}
.pay-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.pay-row input,.pay-row select{padding:6px 8px;border:1.5px solid #e0d5c5;border-radius:8px;font-family:'Outfit';font-size:.82rem;min-width:0}
.pay-row input[type=date]{flex:1.2}
.pay-row input[type=number]{flex:1;max-width:90px}
.pay-row select{flex:1}
.pay-row .act.del{flex-shrink:0}
.pay-row-err{background:#fdf3f2;border-radius:8px;padding:3px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid #ece2d4;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.kpi span{font-size:.74rem;color:#9a8a82;text-transform:uppercase;letter-spacing:.03em}
.kpi b{font-family:'Fraunces',serif;font-size:1.25rem;color:var(--bordeaux)}
.scan-wrap{position:relative;width:100%;max-width:340px;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1/1}
.scan-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:18%;border:3px solid var(--caramel);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.25);pointer-events:none}
.overlay{position:fixed;inset:0;background:rgba(43,26,31,.45);display:none;align-items:center;
  justify-content:center;z-index:50;backdrop-filter:blur(3px)}
.overlay.show{display:flex}
.modal{background:var(--paper);border-radius:18px;padding:28px;width:min(560px,92vw);max-height:88vh;
  overflow:auto;box-shadow:0 20px 60px rgba(82,37,47,.3)}
.modal h3{color:var(--bordeaux);font-size:1.3rem;margin-bottom:18px;font-weight:600}
.field{margin-bottom:14px}
.field label{display:block;font-size:.78rem;color:#7a6a62;margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid #e0d5c5;
  border-radius:10px;font-family:'Outfit';font-size:16px;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--caramel)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.bar-wrap{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar{width:62%;background:linear-gradient(180deg,var(--caramel-2),var(--caramel));border-radius:7px 7px 0 0;transition:.5s;min-height:2px}
.bar-lbl{font-size:.72rem;color:#9a8a82}
.bar-val{font-size:.72rem;color:var(--bordeaux);font-weight:600}
.search{padding:9px 14px;border:1.5px solid #e0d5c5;border-radius:10px;font-family:'Outfit';
  font-size:16px;background:#fff;width:230px;max-width:100%}
.search:focus{outline:none;border-color:var(--caramel)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-head{text-align:center;font-size:.7rem;text-transform:uppercase;color:#9a8a82;font-weight:600;padding:6px}
.cal-cell{min-height:78px;min-width:0;border:1px solid #f0eae0;border-radius:10px;padding:6px;font-size:.78rem;background:#fff;overflow:hidden}
.cal-cell.other{background:var(--creme-2);opacity:.5}
.cal-cell.today{border-color:var(--caramel);border-width:2px}
.cal-num{font-weight:600;color:var(--bordeaux);font-size:.82rem}
.cal-ev{display:block;max-width:100%;background:var(--bordeaux);color:var(--creme);border-radius:5px;padding:2px 5px;
  font-size:.66rem;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.cal-ev.cmd{background:var(--caramel)}
.cal-nav{display:flex;gap:8px;align-items:center}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hide{display:none}
.note{font-size:.76rem;color:#9a8a82;margin-top:8px;line-height:1.5}
.banner{background:#fbeede;border:1px solid var(--caramel);color:#7a5a20;border-radius:12px;padding:12px 16px;font-size:.82rem;margin-bottom:18px;display:flex;gap:10px;align-items:center;line-height:1.4}
.bom-line{display:grid;grid-template-columns:1fr 90px 70px 32px;gap:8px;align-items:center;margin-bottom:8px}
.bom-line .x{cursor:pointer;color:var(--red);font-weight:700;text-align:center;font-size:1.1rem}
.flav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.flav-row{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #e0d5c5;border-radius:10px;padding:6px 10px}
.flav-row.on{border-color:var(--caramel);background:var(--creme-2)}
.flav-row .nm{flex:1;font-size:.82rem;line-height:1.2}
.flav-row input[type=number]{width:54px;padding:5px;border:1px solid #e0d5c5;border-radius:7px;font-size:14px;text-align:center}
.flav-row input[type=checkbox]{width:auto;flex-shrink:0}
.pill{display:inline-block;background:var(--creme);color:var(--bordeaux);border-radius:14px;padding:2px 9px;font-size:.72rem;margin:2px 2px 0 0}
.sum-box{background:var(--creme-2);border-radius:10px;padding:10px 12px;font-size:.84rem;display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.sum-box b{color:var(--bordeaux)}
.cmd-line{border:1.5px solid #e0d5c5;border-radius:12px;padding:14px;margin-bottom:12px;background:#fff;position:relative}
.cmd-line .line-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cmd-line .line-type{font-family:'Fraunces',serif;font-weight:600;color:var(--bordeaux);font-size:.95rem}
.cmd-line .line-del{cursor:pointer;color:var(--red);font-weight:600;font-size:.8rem}
.cmd-line .line-sub{font-size:.74rem;color:#9a8a82;margin-left:8px;font-weight:400;font-family:'Outfit'}
.add-line-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.add-line-row .btn{flex:1;min-width:90px}
.flav-sel{width:60px;padding:5px;border:1px solid #e0d5c5;border-radius:7px;font-size:14px;background:#fff}
.trace-step{border-left:3px solid var(--caramel);padding:4px 0 4px 14px;margin-left:6px;position:relative}
.trace-step::before{content:'';position:absolute;left:-7px;top:10px;width:11px;height:11px;border-radius:50%;background:var(--caramel)}
.labels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.label{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center;page-break-inside:avoid;position:relative}
.label .qr{flex-shrink:0}
.label .qr canvas{display:block;width:84px;height:84px;image-rendering:pixelated}
.label .info{font-size:.8rem;line-height:1.5;min-width:0;display:flex;flex-direction:column;gap:1px;flex:1}
.label .info b{color:#000;font-family:'Outfit',sans-serif;font-size:.92rem;font-weight:700}
.label .info .meta{color:#333}
.label .label-print{flex-shrink:0}
.label .label-actions{flex-shrink:0;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.label .label-actions .copies{font-size:.74rem;color:#7a6a62;display:flex;align-items:center;gap:5px}
.label .label-actions .copies input{width:54px;padding:5px 7px;border:1.5px solid #e0d5c5;border-radius:8px;font-family:'Outfit'}
.act-status{cursor:pointer;display:inline-block}
@media print{
  .side,.topbar .flex,.banner,.toast,.label-actions{display:none!important}
  .main{margin-left:0!important;padding:0!important}
  .panel{box-shadow:none;border:none;padding:0}
  .label{border:1px solid #000}
  .labels-grid{grid-template-columns:repeat(2,1fr)}
}
.toast{position:fixed;bottom:24px;right:24px;background:var(--bordeaux);color:var(--creme);
  padding:13px 20px;border-radius:11px;font-size:.88rem;box-shadow:0 8px 24px rgba(82,37,47,.3);
  z-index:99;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;max-width:80vw}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:820px){
  /* iPhone : on masque la barre latérale, on utilise la tabbar + feuille menu */
  .side{display:none}
  .main{margin-left:0;max-width:100%;width:100%;padding:16px 14px calc(80px + env(safe-area-inset-bottom))}
  .topbar h1{font-size:1.5rem}
  .row2,.row3{grid-template-columns:1fr}
  table{font-size:.82rem}td,th{padding:9px 7px}
  .modal{width:94vw;padding:20px;max-height:84vh}
  .labels-grid{grid-template-columns:1fr}
  .panel{padding:16px}
  /* Calendrier compact */
  .cal-grid{gap:3px}
  .cal-head{font-size:.58rem;padding:2px}
  .cal-cell{min-height:54px;padding:3px;border-radius:7px;font-size:.7rem}
  .cal-num{font-size:.72rem}
  .cal-ev{font-size:.56rem;padding:1px 3px}
}
/* La tabbar et la feuille ne s affichent que sur petit écran */
.tabbar,.sheet-overlay{display:none}
@media(max-width:820px){
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:linear-gradient(90deg,var(--bordeaux),var(--bordeaux-2));
    padding:6px 2px;padding-bottom:calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(82,37,47,.22)}
  .tabbar button{flex:1;appearance:none;-webkit-appearance:none;background:transparent;border:none;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
    color:var(--creme);font-family:inherit;font-size:.6rem;-webkit-tap-highlight-color:transparent;border-radius:12px}
  .tabbar button *{pointer-events:none}
  .tabbar button .ico{font-size:1.25rem}
  .tabbar button.active{background:var(--creme);color:var(--bordeaux)}
  .sheet-overlay{position:fixed;inset:0;background:rgba(43,26,31,.45);z-index:60;display:none;
    align-items:flex-end;backdrop-filter:blur(3px)}
  .sheet-overlay.show{display:flex}
  .sheet{background:var(--paper);width:100%;border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:84vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(82,37,47,.3)}
  .sheet-grip{width:42px;height:5px;border-radius:3px;background:#d8c9b0;margin:8px auto 14px}
  .sheet h3{color:var(--bordeaux);font-size:1.2rem;margin-bottom:14px}
