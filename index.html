<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sensations Macarons — Pilotage</title>
<meta name="theme-color" content="#52252F">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sensations">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
/* Polices hébergées en local (plus de dépendance Google Fonts, plus de reflow au chargement) */
@font-face{font-family:'Outfit';font-style:normal;font-weight:300;font-display:swap;src:url('fonts/Outfit-Light.ttf') format('truetype')}
@font-face{font-family:'Outfit';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/Outfit-Regular.ttf') format('truetype')}
@font-face{font-family:'Outfit';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/Outfit-Medium.ttf') format('truetype')}
@font-face{font-family:'Outfit';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/Outfit-SemiBold.ttf') format('truetype')}
@font-face{font-family:'Outfit';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/Outfit-Bold.ttf') format('truetype')}
/* Bellota : titres et accents (remplace l'ancienne Fraunces) */
@font-face{font-family:'Bellota';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/BellotaText-Regular.ttf') format('truetype')}
@font-face{font-family:'Bellota';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/BellotaText-Bold.ttf') format('truetype')}
</style>
<style>
:root{
  --bordeaux:#52252F; --bordeaux-2:#6e3340; --bordeaux-3:#3d1a22; --creme:#E8DDCD; --creme-2:#F5F0E8;
  --caramel:#AA7C39; --caramel-2:#c6974f; --gold:#AA7C39; --ink:#2b1a1f; --paper:#fbf8f3;
  --green:#3f7d52; --red:#b04a3e; --shadow:rgba(82,37,47,.12);
  /* tokens esthétiques */
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px;
  --sh-1:0 1px 2px rgba(82,37,47,.04), 0 2px 8px rgba(82,37,47,.06);
  --sh-2:0 4px 14px rgba(82,37,47,.08), 0 10px 30px rgba(82,37,47,.07);
  --sh-3:0 10px 30px rgba(82,37,47,.12), 0 24px 60px rgba(82,37,47,.10);
  --hair:rgba(170,124,57,.16);
  --grad-bordeaux:linear-gradient(155deg,var(--bordeaux-2),var(--bordeaux) 55%,var(--bordeaux-3));
  --grad-gold:linear-gradient(135deg,var(--caramel-2),var(--caramel));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  background-image:
    radial-gradient(1200px 600px at 8% -5%,rgba(170,124,57,.10),transparent 55%),
    radial-gradient(1000px 700px at 105% 110%,rgba(82,37,47,.08),transparent 55%),
    radial-gradient(circle at 50% 40%,rgba(255,255,255,.5),transparent 70%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:.002em}
h1,h2,h3,.serif{font-family:'Bellota','Georgia','Times New Roman',serif;letter-spacing:-.01em}
.app{display:flex;min-height:100vh;width:100%;overflow-x:hidden}
.side{width:236px;background:var(--grad-bordeaux);
  color:var(--creme);padding:26px 16px;position:fixed;height:100vh;display:flex;flex-direction:column;gap:4px;z-index:10;
  box-shadow:inset -1px 0 0 rgba(0,0,0,.18), 4px 0 30px rgba(82,37,47,.14)}
.side::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(420px 220px at 30% 0%,rgba(198,151,79,.16),transparent 60%);opacity:.9}
.brand{font-family:'Bellota',serif;font-size:1.45rem;font-weight:600;line-height:1.12;margin-bottom:4px;position:relative}
.brand small{display:block;font-family:'Outfit';font-size:.62rem;letter-spacing:.26em;
  text-transform:uppercase;color:var(--caramel-2);margin-top:8px;font-weight:600}
.brand-rule{height:1px;background:linear-gradient(90deg,transparent,rgba(232,221,205,.4),transparent);margin:16px 0;position:relative}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;position:relative;scrollbar-width:thin}
.nav button{appearance:none;-webkit-appearance:none;background:transparent;border:none;margin:0;
  font-family:inherit;text-align:left;width:100%;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 14px;
  border-radius:11px;font-size:.9rem;color:rgba(232,221,205,.82);transition:.2s cubic-bezier(.4,0,.2,1);font-weight:400;-webkit-tap-highlight-color:transparent;position:relative}
.nav button *{pointer-events:none}
.nav button:hover{background:rgba(232,221,205,.12);color:var(--creme);transform:translateX(2px)}
.nav button.active{background:linear-gradient(90deg,rgba(245,240,232,.96),rgba(232,221,205,.9));color:var(--bordeaux);font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.nav button.active::before{content:'';position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:4px;height:60%;border-radius:0 4px 4px 0;background:var(--caramel-2)}
.nav .ico{font-size:1.05rem;width:20px;text-align:center}
.nav .sep{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(232,221,205,.42);padding:14px 14px 4px;font-weight:600}
/* MENU SIMPLIFIÉ : section « Avancé » repliée par défaut (barre latérale + feuille iPhone) */
.nav-adv{display:none}
.nav-adv.open{display:block}
.sheet-grid.nav-adv{display:none}
.sheet-grid.nav-adv.open{display:grid}
.nav .nav-adv-toggle{appearance:none;-webkit-appearance:none;width:100%;text-align:left;border:none;cursor:pointer;
  background:rgba(232,221,205,.07);color:rgba(232,221,205,.75);font-family:inherit;font-weight:600;font-size:.78rem;
  letter-spacing:.08em;text-transform:uppercase;padding:11px 14px;margin-top:12px;border-radius:9px;
  display:flex;align-items:center;gap:9px;-webkit-tap-highlight-color:transparent}
.nav .nav-adv-toggle .adv-chev{transition:transform .2s;display:inline-block;width:20px;text-align:center;color:var(--caramel)}
.nav .nav-adv-toggle.open .adv-chev{transform:rotate(90deg)}
.sheet-adv-toggle{appearance:none;-webkit-appearance:none;width:100%;border:1.5px dashed #d8c9b2;background:#faf6ee;
  color:#8a6d4a;font-family:inherit;font-weight:600;font-size:.85rem;padding:11px;border-radius:11px;cursor:pointer;
  margin:4px 0 10px;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent}
.sheet-adv-toggle .adv-chev{transition:transform .2s;display:inline-block;color:var(--caramel)}
.sheet-adv-toggle.open .adv-chev{transform:rotate(90deg)}
.sheet-adv-toggle .adv-count{font-weight:400;color:#b0a193;font-size:.76rem}
.side-foot{font-size:.66rem;color:rgba(232,221,205,.55);line-height:1.5;margin-top:8px}
.side-foot .foot-help{display:block;margin-bottom:8px}
.side-foot .foot-btn{width:100%;margin-top:6px}
.main{margin-left:236px;flex:1;min-width:0;max-width:calc(100% - 236px);padding:32px 40px 60px;overflow-x:hidden}
@keyframes viewIn{ from{opacity:0} to{opacity:1} }
.main.view-in{ animation:viewIn .22s ease }
@media (prefers-reduced-motion: reduce){ .main.view-in{ animation:none } }
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;flex-wrap:wrap;gap:12px;
  padding-bottom:18px;border-bottom:1px solid var(--hair)}
.topbar h1{font-size:2.05rem;font-weight:600;color:var(--bordeaux);line-height:1.05}
.topbar p{color:#8a7a72;font-size:.9rem;margin-top:4px}
.btn{appearance:none;-webkit-appearance:none;border:none;margin:0;font-family:'Outfit',system-ui,sans-serif;cursor:pointer;
  background:var(--grad-bordeaux);color:var(--creme);padding:10px 18px;-webkit-tap-highlight-color:transparent;
  border-radius:11px;font-size:.86rem;font-weight:600;transition:.18s cubic-bezier(.4,0,.2,1);display:inline-flex;gap:7px;align-items:center;text-align:center;justify-content:center;
  box-shadow:var(--sh-1);letter-spacing:.01em}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px);box-shadow:var(--sh-2)}
.btn:active{transform:translateY(0);filter:brightness(.97);box-shadow:var(--sh-1)}
.btn.gold{background:var(--grad-gold)}
.btn.ghost{background:#fff;color:var(--bordeaux);border:1.5px solid var(--hair);box-shadow:var(--sh-1)}
.btn.danger{background:linear-gradient(135deg,#c0584a,var(--red,#b0392c));color:#fff}
.btn.ghost:hover{background:var(--bordeaux);color:var(--creme);border-color:var(--bordeaux)}
.btn.sm{padding:6px 12px;font-size:.78rem;border-radius:9px}
.home-hero{margin:0 0 18px;border-radius:16px;overflow:hidden;position:relative;
  box-shadow:0 4px 16px rgba(73,15,37,.08)}
.home-topbar{border-bottom:none;padding-bottom:0;margin-bottom:14px;justify-content:flex-end}
.home-topbar .flex{justify-content:flex-end;align-items:center}
.home-topbar .btn.sm{font-size:.82rem;padding:8px 14px}
.home-hero img{width:100%;height:auto;display:block}
.home-hero-caption{position:absolute;top:66%;left:72%;transform:translate(-50%,-50%);width:30%;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  color:#EBDFCB;pointer-events:none}
.home-hero-caption .hhc-title{font-family:'Bellota','Bellota',serif;font-weight:600;
  font-size:clamp(.72rem,1.9vw,1.2rem);line-height:1.05;letter-spacing:0;white-space:nowrap}
.home-hero-caption .hhc-sub{font-family:'Outfit',sans-serif;font-weight:400;
  font-size:clamp(.62rem,1.6vw,.92rem);letter-spacing:.14em;text-transform:uppercase;
  margin-top:.5em;opacity:.92}
.home-hero-caption .hhc-clock{font-family:'Outfit',sans-serif;font-weight:300;
  font-size:clamp(.9rem,2.4vw,1.45rem);letter-spacing:.05em;margin-top:.7em;
  font-variant-numeric:tabular-nums;opacity:.95}
.home-hero-caption .hhc-ca{display:flex;flex-direction:column;align-items:center;
  margin-top:.7em;font-family:'Bellota','Bellota',serif;font-weight:600;
  font-size:clamp(1rem,2.8vw,1.6rem);line-height:1;color:#fff}
.home-hero-caption .hhc-ca-lbl{font-family:'Outfit',sans-serif;font-weight:400;
  font-size:clamp(.52rem,1.3vw,.72rem);letter-spacing:.12em;text-transform:uppercase;
  margin-top:.45em;opacity:.82}
.home-hero-caption::before{content:'';position:absolute;top:-0.7em;left:50%;transform:translateX(-50%);
  width:30px;height:1px;background:#EBDFCB;opacity:.5}
@media(max-width:820px){ .home-hero{border-radius:13px} }
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:28px}
.mat-cards{display:flex;flex-direction:column;gap:14px}
.mat-card{border:1px solid #ece3d5;border-radius:16px;padding:16px 16px 14px;background:#fff;box-shadow:0 2px 8px rgba(73,15,37,.05)}
.mat-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.mat-card-name{font-size:1.02rem;line-height:1.3}
.mat-card-name b{color:var(--ink)}
.mat-marque{display:block;color:#9a8a82;font-size:.74rem;margin-top:2px}
.mat-cat-pill{color:#fff;border-radius:999px;padding:4px 12px;font-size:.9rem;flex-shrink:0}
.mat-card-grid{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;margin-bottom:12px}
.mat-stock{font-size:.95rem;color:#6a5a52}
.mat-stock b{color:var(--ink);font-size:1.05rem}
.mat-state{text-align:right}
.mat-sub{color:#9a8a82;font-size:.85rem}
.mat-lots{text-align:right}
.mat-dlc{grid-column:1 / -1}
.mat-card-actions{display:flex;gap:8px;padding-top:12px;border-top:1px dashed #ece3d5}
.mat-card-actions .qa{flex:0 0 auto}
.cards-old-placeholder{}
/* ---- Cartes Commandes ---- */
.cmd-cards{display:flex;flex-direction:column;gap:14px}
.cmd-card{border:1px solid #ece3d5;border-radius:16px;padding:15px 16px 13px;background:#fff;box-shadow:0 2px 8px rgba(73,15,37,.05)}
.cmd-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cmd-client b{color:var(--ink);font-size:1.02rem}
.cmd-meta{color:#9a8a82;font-size:.76rem;margin-top:2px}
.cmd-contenu{margin:9px 0 12px;font-size:.9rem;color:#5a4a44;line-height:1.4}
.cmd-primary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:11px;margin-bottom:11px;border-bottom:1px dashed #ece3d5}
.cmd-montant{font-family:'Bellota',serif;font-weight:600;font-size:1.15rem;color:var(--bordeaux,#490F25);margin-left:auto}
.cmd-secondary{display:flex;gap:8px;flex-wrap:wrap}
.cmd-pill{border:none;border-radius:10px;padding:8px 13px;font-size:.84rem;font-weight:600;cursor:pointer;font-family:inherit}
.cmd-pill.detail{background:#f2ece4;color:#490F25}
.cmd-pill.pay-ok{background:#dcebdd;color:#2e7d45}
.cmd-pill.pay-due{background:#f7dedb;color:#b3261e}
.cmd-statut-select{border:none;border-radius:10px;padding:8px 12px;font-size:.84rem;font-weight:600;cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none;text-align:center}
.cmd-statut-select.st-prepa{background:#f6e4cf;color:#a9772a}
.cmd-statut-select.st-prete{background:#d8e6f2;color:#2f6a9a}
.cmd-statut-select.st-livree{background:#dcebdd;color:#3f7d52}
.cmd-card .qa.gold{border-color:#e3c48f;color:#9a7320}
.cmd-check{width:20px;height:20px;flex-shrink:0;accent-color:var(--bordeaux,#490F25);cursor:pointer;margin:2px 0 0}
.card{background:linear-gradient(160deg,#ffffff,#fdfaf5);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-2);border:1px solid var(--hair);position:relative;overflow:hidden}
.card.accent::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:var(--card-accent,#c9a227)}
.card::after{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--grad-gold);opacity:.85}
.card.clickable{cursor:pointer;transition:transform .16s cubic-bezier(.4,0,.2,1),box-shadow .16s ease}
.card.clickable:hover{transform:translateY(-3px);box-shadow:var(--sh-3)}
.card.clickable:active{transform:translateY(-1px)}
.card .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.13em;color:#9a8a82;font-weight:600}
.card .val{font-family:'Bellota',serif;font-size:2.1rem;font-weight:600;color:var(--bordeaux);margin-top:7px;line-height:1;letter-spacing:-.02em}
.card .sub{font-size:.78rem;color:#9a8a82;margin-top:7px}
.card .corner{position:absolute;top:-10px;right:-8px;font-size:3.4rem;opacity:.07}
.panel{background:#fff;border-radius:var(--r-lg);padding:24px 26px;box-shadow:var(--sh-2);border:1px solid var(--hair);margin-bottom:22px;max-width:100%;position:relative}
.ai-fold{background:#fff;border-radius:var(--r-lg);box-shadow:var(--sh-2);border:1px solid var(--hair);margin-bottom:14px;overflow:hidden}
.ai-fold>summary{cursor:pointer;list-style:none;padding:16px 20px;font-size:1.05rem;font-weight:600;color:var(--bordeaux);display:flex;align-items:center;gap:10px;user-select:none}
.ai-fold>summary::-webkit-details-marker{display:none}
.ai-fold>summary .ai-fold-arrow{margin-left:auto;transition:transform .2s;color:#9a8a82;font-size:.9rem}
.ai-fold[open]>summary .ai-fold-arrow{transform:rotate(180deg)}
.ai-fold>summary:active{background:var(--creme-2)}
.ai-fold .ai-fold-body{padding:0 16px 12px}
.ai-fold .ai-fold-body .panel,.ai-fold .ai-fold-body>div{box-shadow:none;border:none;margin-bottom:0;padding-left:6px;padding-right:6px}
.panel h2{font-size:1.2rem;color:var(--bordeaux);margin-bottom:18px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;letter-spacing:-.01em}
.table-wrap{width:100%;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;display:block;overscroll-behavior-x:contain}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.87rem}
.table-wrap table{min-width:max-content}
/* Première colonne FIGÉE lors du défilement horizontal (type Excel) :
   la colonne d'identification reste visible. Sa largeur est BORNÉE pour ne pas
   manger l'écran ; un texte long s'enroule sur 2 lignes plutôt que d'allonger la colonne. */
.table-wrap th:first-child,
.table-wrap td:first-child{
  position:sticky; left:0; z-index:2;
  background:#fff;
  border-right:2px solid #e7dcc9; /* séparation nette (plus fiable que box-shadow sur iOS) */
  box-shadow:3px 0 5px rgba(73,15,37,.07);
  max-width:42vw;                 /* ne dépasse jamais ~40% de l'écran */
  white-space:normal;             /* autorise le retour à la ligne */
  overflow-wrap:anywhere;         /* coupe les mots très longs si besoin */
}
.table-wrap thead th:first-child{ z-index:3; background:#fff; }
.table-wrap tr:hover td:first-child{ background:var(--creme-2); }
/* Les lignes paires ont un fond translucide qui, sur la colonne figée, laissait
   voir les cellules défiler au travers (bug iOS). On force un fond OPAQUE dédié. */
.table-wrap tbody tr:nth-child(even) td:first-child{ background:#f5f0e8; }
.table-wrap tbody tr:nth-child(odd) td:first-child{ background:#ffffff; }
/* Désactive la colonne figée quand on ne le souhaite pas (classe .no-freeze). */
.table-wrap.no-freeze th:first-child,
.table-wrap.no-freeze td:first-child{ position:static; box-shadow:none; max-width:none; }
th{text-align:left;padding:11px 12px;color:#9a8a82;font-weight:600;font-size:.7rem;
  text-transform:uppercase;letter-spacing:.09em;border-bottom:2px solid var(--creme)}
td{padding:12px;border-bottom:1px solid #f2ece2;vertical-align:top}
tbody tr:nth-child(even) td{background:rgba(245,240,232,.4)}
tr:hover td{background:var(--creme-2)}
.tag{display:inline-block;padding:3px 11px;border-radius:20px;font-size:.73rem;font-weight:600;white-space:nowrap;letter-spacing:.01em}
/* Barre de filtres par tags libres (commandes) */
.cmd-tagbar{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}
.cmd-tagbar:empty{display:none}
.cmd-tag-grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.cmd-tag-cat{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#9a8a82;margin-right:2px;min-width:62px}
.cmd-tag{padding:4px 11px;border-radius:20px;font-size:.74rem;font-weight:600;border:1.5px solid #e7dccb;background:#fff;color:var(--bordeaux,#52252F);cursor:pointer;transition:all .12s;white-space:nowrap}
.cmd-tag:hover{border-color:var(--caramel,#AA7C39)}
.cmd-tag.on{background:var(--bordeaux,#52252F);border-color:var(--bordeaux,#52252F);color:#fff}
.cmd-tag-clear{align-self:flex-start;margin-top:2px;padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:600;border:1.5px solid #e5b4ae;background:#fdf3f2;color:var(--red,#b3261e);cursor:pointer}
/* Tag d'emplacement de batch : par défaut (iPad/desktop) on montre le nom complet,
   la lettre seule est masquée. La bascule iPhone se fait dans la media query mobile. */
.emp-tag .emp-letter{display:none}
/* COMMANDES : menu déroulant de statut (changement direct) + période figée (mois/semaine) */
.status-select{border:none;border-radius:14px;padding:4px 8px;font-size:.74rem;font-weight:600;cursor:pointer;font-family:inherit;-webkit-appearance:none;appearance:none;text-align:center}
.status-select.status-todo{background:#fef0d9;color:#9a6a14}
.status-select.status-ok{background:#e3f0e7;color:#2e7d32}
.status-select.status-done{background:#e9eef9;color:#3a5a9a}
.cmd-period{display:block;color:#8a7a72;font-size:.72rem;font-weight:600;margin-top:1px}
/* BLOC REPLIABLE réutilisable : montre N éléments, le reste masqué derrière un chevron.
   Fluidifie les longues listes verticales (lots, consommations, historiques…). */
.collapse-more{display:none}
.collapse-block.open .collapse-more{display:revert}
tr.collapse-more{display:none}
.collapse-block.open tr.collapse-more{display:table-row}
.collapse-toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--caramel);
  font-weight:600;font-size:.82rem;padding:8px 4px;user-select:none;background:none;border:none;font-family:inherit}
.collapse-toggle .chev{transition:transform .2s;display:inline-block;font-size:.9em}
.collapse-block.open .collapse-toggle .chev{transform:rotate(180deg)}
.collapse-toggle:hover{filter:brightness(.92)}
/* PRODUCTIONS — sections par recette + repérage instantané du composant.
   Bande latérale colorée épaisse + grosse pastille : coque/ganache/assemblé
   identifiables en un coup d'œil, sans lire. */
.prod-sec-head td{background:linear-gradient(90deg,#ede3d3,#f5efe4);border-top:2px solid var(--caramel);
  font-family:'Bellota',serif;font-size:1.02rem;color:var(--bordeaux);font-weight:600;padding:10px 12px!important;letter-spacing:-.01em}
.prod-sec-head .sec-count{font-family:'Outfit',system-ui;font-size:.74rem;font-weight:500;color:#9a8a82;margin-left:8px}
tr.prow{border-left:7px solid transparent}
tr.prow-coques{border-left-color:#8a6d3b;background:#fbf7f0}
tr.prow-ganache{border-left-color:#5a3a2a;background:#f7f2ee}
tr.prow-assemble{border-left-color:#3f7d52;background:#f3f9f4}
tr.prow-degustation{border-left-color:#caa23b;background:#fcf8ec}
tr.prow-complet{border-left-color:#6aa3a0;background:#f3f8f8}
.comp-pill{display:inline-flex;align-items:center;gap:5px;border-radius:9px;padding:5px 11px;font-weight:700;font-size:.92rem;color:#fff;white-space:nowrap;letter-spacing:.01em}
.comp-pill .cp-ico{font-size:1.05rem}
.comp-coques{background:#8a6d3b}.comp-ganache{background:#5a3a2a}.comp-assemble{background:#3f7d52}.comp-degustation{background:#caa23b}.comp-complet{background:#6aa3a0}
.tag.in{background:#e3f0e7;color:var(--green)}
.tag.out{background:#f6e3e0;color:var(--red)}
.tag.low{background:#fbeede;color:var(--caramel)}
.tag.ok{background:#e3f0e7;color:var(--green)}
.tag.event{background:#efe3f0;color:#7a4b82}
.tag.todo{background:#f6e3e0;color:var(--red)}
.tag.done{background:#e3f0e7;color:var(--green)}
.tag.warn{background:#fbeede;color:var(--caramel)}
.empty{text-align:center;padding:40px;color:#b3a59c;font-style:italic}
.act{cursor:pointer;color:var(--caramel);font-weight:600;font-size:.8rem;margin-right:10px;white-space:nowrap}
.act:hover{text-decoration:underline}.act.del{color:var(--red)}
/* Boutons d'action rapide sur les lignes (mobile-friendly, faciles à toucher) */
.qa{display:inline-flex;align-items:center;gap:3px;padding:5px 10px;margin:2px 3px 2px 0;border:1.5px solid var(--hair);border-radius:9px;background:#fff;color:var(--bordeaux);font-size:.76rem;font-weight:600;cursor:pointer;white-space:nowrap;line-height:1;box-shadow:var(--sh-1);transition:.15s}
.qa:hover{border-color:var(--caramel);transform:translateY(-1px)}
.qa:active{transform:scale(.96)}
.qa.pay{border-color:#bfe0c8;color:#2e7d32}
.qa.status{border-color:#e4cf9a;color:#9a7b1f}
.qa.edit{border-color:#d9c8e0;color:#7a4b82}
.qa.del{border-color:#f0cfc9;color:var(--red)}
.qa.del-full{border-color:#b3261e;background:linear-gradient(135deg,#c0584a,#b0392c);color:#fff}
.qa-row{display:flex;flex-wrap:wrap;gap:2px;justify-content:flex-end}
.link-name{cursor:pointer;color:var(--bordeaux);border-bottom:1px dotted var(--caramel)}
.link-name:hover{color:var(--caramel)}
.jump-arrow{display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--caramel);font-weight:700;margin-left:4px;width:20px;height:20px;border-radius:50%;
  background:var(--creme-2,#f3ece0);font-size:.8rem;line-height:1;-webkit-tap-highlight-color:transparent;
  transition:.15s;vertical-align:middle}
.sugg-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #d5e7d9;
  border-radius:12px;padding:10px 12px;margin-bottom:8px}
.sugg-row .sugg-main{flex:1;min-width:0;line-height:1.25}
.sugg-row .btn{flex:none}
.jump-arrow:hover,.jump-arrow:active{background:var(--caramel);color:#fff}
.pay-toggle{display:inline-flex;gap:6px;flex-wrap:wrap}
.pay-toggle .pay-opt{display:inline-flex;align-items:center;gap:5px;font-size:.84rem;padding:4px 8px;border:1.5px solid #e0d5c5;border-radius:9px;cursor:pointer;background:#fff}
.pay-toggle .pay-opt input{width:auto;margin:0}
.pay-toggle.sm .pay-opt{font-size:.76rem;padding:3px 6px}
.sel-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fbf4ec;border:1px solid #e8dccd;border-radius:14px;padding:10px 14px;font-size:.86rem;font-weight:600;color:var(--bordeaux);position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;box-shadow:0 6px 24px rgba(73,15,37,.18)}
#updateBanner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 130px);z-index:9999;display:flex;align-items:center;gap:12px;background:var(--bordeaux);color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(43,26,31,.35);font-size:.88rem;max-width:92vw}
#updateBanner button{border:none;border-radius:9px;padding:8px 12px;font-family:'Outfit';font-weight:600;cursor:pointer}
#updateBanner #updateReload{background:var(--caramel);color:#fff}
#updateBanner #updateDismiss{background:transparent;color:#fff;opacity:.7;padding:8px 6px}
.mult-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fbf4ec;border:1px solid #e8dccd;border-radius:10px;padding:8px 12px;margin-bottom:12px}
.mult-bar label{font-weight:600;color:var(--bordeaux);font-size:.86rem}
.mult-bar input{width:90px;padding:7px 10px;border:1.5px solid #e0d5c5;border-radius:9px;font-family:'Outfit'}
.pay-ledger{background:#fbf4ec;border:1px solid #e8dccd;border-radius:10px;padding:10px 12px}
.pay-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.pay-row input,.pay-row select{padding:6px 8px;border:1.5px solid #e0d5c5;border-radius:8px;font-family:'Outfit';font-size:.82rem;min-width:0}
.pay-row input[type=date]{flex:1.2}
.pay-row input[type=number]{flex:1;max-width:90px}
.pay-row select{flex:1}
.pay-row .act.del{flex-shrink:0}
.pay-row-err{background:#fdf3f2;border-radius:8px;padding:3px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:linear-gradient(160deg,#fff,#fdfaf5);border:1px solid var(--hair);border-radius:var(--r-md);padding:13px 15px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--sh-1)}
.kpi span{font-size:.72rem;color:#9a8a82;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi b{font-family:'Bellota',serif;font-size:1.3rem;color:var(--bordeaux);letter-spacing:-.01em}
.kpi-note{display:block;font-size:.66rem;line-height:1.3;color:#9a8a82;font-weight:500;margin-top:2px;text-transform:none;letter-spacing:0}
.scan-wrap{position:relative;width:100%;max-width:340px;margin:0 auto;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:1/1}
.scan-wrap video{width:100%;height:100%;object-fit:cover;display:block}
.scan-frame{position:absolute;inset:18%;border:3px solid var(--caramel);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.25);pointer-events:none}
.overlay{position:fixed;inset:0;background:rgba(43,26,31,.5);display:none;align-items:center;
  justify-content:center;z-index:50;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.overlay.show{display:flex;animation:ovIn .2s ease}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(170deg,#fdfbf7,var(--paper));border-radius:var(--r-xl);padding:28px;width:min(560px,92vw);max-height:88vh;
  overflow:auto;box-shadow:var(--sh-3);border:1px solid rgba(255,255,255,.6);animation:modIn .26s cubic-bezier(.22,.61,.36,1)}
@keyframes modIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@media (prefers-reduced-motion: reduce){ .overlay.show,.modal{animation:none} }
.modal h3{color:var(--bordeaux);font-size:1.4rem;margin-bottom:18px;font-weight:600;letter-spacing:-.01em}
.field{margin-bottom:14px}
.field label{display:block;font-size:.78rem;color:#7a6a62;margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1.5px solid #e7dccb;
  border-radius:var(--r-sm);font-family:'Outfit',system-ui,sans-serif;font-size:16px;background:#fff;color:var(--ink);transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--caramel);box-shadow:0 0 0 3px rgba(170,124,57,.14)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.bar-wrap{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:10px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar{width:62%;background:linear-gradient(180deg,var(--caramel-2),var(--caramel));border-radius:7px 7px 0 0;transition:.5s;min-height:2px}
.bar-lbl{font-size:.72rem;color:#9a8a82}
.bar-val{font-size:.72rem;color:var(--bordeaux);font-weight:600}
.search{padding:10px 14px;border:1.5px solid #e7dccb;border-radius:var(--r-sm);font-family:'Outfit',system-ui,sans-serif;
  font-size:16px;background:#fff;width:230px;max-width:100%;transition:.15s}
.search:focus{outline:none;border-color:var(--caramel);box-shadow:0 0 0 3px rgba(170,124,57,.14)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-head{text-align:center;font-size:.7rem;text-transform:uppercase;color:#9a8a82;font-weight:600;padding:6px}
.cal-cell{min-height:78px;min-width:0;border:1px solid #f0eae0;border-radius:10px;padding:6px;font-size:.78rem;background:#fff;overflow:hidden}
.cal-cell.other{background:var(--creme-2);opacity:.5}
.cal-cell.today{border-color:var(--caramel);border-width:2px}
.cal-num{font-weight:600;color:var(--bordeaux);font-size:.82rem}
.cal-ev{display:block;max-width:100%;background:var(--bordeaux);color:var(--creme);border-radius:5px;padding:2px 5px;
  font-size:.66rem;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.cal-ev.cmd{background:var(--caramel)}
.cal-nav{display:flex;gap:8px;align-items:center}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hide{display:none}
.note{font-size:.76rem;color:#9a8a82;margin-top:8px;line-height:1.5}
.banner{background:linear-gradient(135deg,#fcf2df,#f8ead0);border:1px solid var(--caramel);color:#7a5a20;border-radius:var(--r-md);padding:13px 16px;font-size:.83rem;margin-bottom:18px;display:flex;gap:11px;align-items:center;line-height:1.45;box-shadow:var(--sh-1)}
.step-head{display:flex;gap:12px;align-items:center;margin:22px 0 10px}
.step-head:first-of-type{margin-top:8px}
.step-num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--caramel,#AA7C39);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:var(--sh-1)}
.step-head b{font-size:.98rem;color:#4a3a2a}
.gauge{display:flex;align-items:center;gap:6px;margin-top:2px}
.gauge-bar{flex:1;height:14px;border-radius:7px;overflow:hidden;display:flex;background:#efe9e1;border:1px solid #e2d8cc}
.gauge-pct{font-size:.72rem;color:#7a6a60;font-weight:600;min-width:32px;text-align:right}
.gauge-empty{font-size:.72rem;color:#b8a89c;font-style:italic;padding:2px 0 2px 10px}
.gauge-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;padding-left:10px}
.gauge-legend span{font-size:.68rem;color:#7a6a60;display:flex;align-items:center;gap:3px}
.gauge-legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.bom-line{display:grid;grid-template-columns:1fr 78px 56px 96px 88px 28px;gap:7px;align-items:center;margin-bottom:8px}
.bom-line .bom-part{font-size:.8rem;padding:6px 4px}
.bom-line .bom-etiq{font-size:.8rem;padding:6px 8px;border:1.5px solid #e7dccb;border-radius:8px}
@media(max-width:820px){ .bom-line{grid-template-columns:1fr 64px 84px 84px 24px;gap:5px} .bom-line>span:nth-child(3){display:none} }
.bom-line .x{cursor:pointer;color:var(--red);font-weight:700;text-align:center;font-size:1.1rem}
.flav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.flav-row{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #e0d5c5;border-radius:10px;padding:6px 10px}
.flav-row.on{border-color:var(--caramel);background:var(--creme-2)}
.flav-row .nm{flex:1;font-size:.82rem;line-height:1.2}
.flav-row input[type=number]{width:54px;padding:5px;border:1px solid #e0d5c5;border-radius:7px;font-size:14px;text-align:center}
.flav-row input[type=checkbox]{width:auto;flex-shrink:0}
.pill{display:inline-block;background:var(--creme);color:var(--bordeaux);border-radius:14px;padding:2px 9px;font-size:.72rem;margin:2px 2px 0 0}
.sum-box{background:linear-gradient(135deg,var(--creme-2),#f0e8da);border:1px solid var(--hair);border-radius:var(--r-sm);padding:11px 13px;font-size:.84rem;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.pay-summary{background:linear-gradient(135deg,var(--creme-2),#f0e8da);border:1px solid var(--hair);border-radius:var(--r-sm);padding:11px 13px;font-size:.88rem;display:flex;flex-direction:column;gap:5px}
.pay-summary>div{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pay-summary b{color:var(--bordeaux)}
.emp-choices{display:flex;flex-direction:column;gap:8px}
.emp-opt{display:flex;align-items:center;gap:9px;cursor:pointer;border:1.5px solid #e8dccd;border-radius:12px;padding:11px 13px;font-size:.92rem;background:#fff;transition:border-color .15s,background .15s}
.emp-opt:has(input:checked){border-color:var(--bordeaux,#490F25);background:#fbf4ec}
.emp-opt input[type=radio]{width:20px;height:20px;flex-shrink:0;accent-color:var(--bordeaux,#490F25);margin:0}
.emp-opt b{flex-shrink:0}
.emp-opt span{flex:1}
/* ---- Journal de bord pointeuse ---- */
.ws-total{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#490F25,#6a1d38);color:#EBDFCB;border-radius:14px;padding:13px 16px;margin-bottom:4px}
.ws-total b{display:block;font-family:'Bellota','Bellota',serif;font-size:1.3rem;color:#fff;line-height:1.1}
.ws-total-lbl{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.ws-total-cout{font-family:'Bellota','Bellota',serif;font-size:1.4rem;font-weight:600;color:#EBDFCB}
.ws-cards{display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow-y:auto;padding-right:2px}
.ws-card{border:1px solid #ece3d5;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(73,15,37,.05)}
.ws-card-head{display:flex;justify-content:space-between;align-items:center;background:#fbf4ec;padding:9px 13px;border-bottom:1px solid #f0e8da}
.ws-date{font-family:'Bellota','Bellota',serif;font-weight:600;color:var(--bordeaux,#490F25);font-size:.96rem;text-transform:capitalize}
.ws-day-tot{font-size:.8rem;color:#8a6d3b;font-weight:600}
.ws-lines{display:flex;flex-direction:column}
.ws-line{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid #f4ede2;font-size:.84rem}
.ws-line:last-child{border-bottom:none}
.ws-line-l{display:flex;align-items:center;gap:8px;flex:1;min-width:0;flex-wrap:wrap}
.ws-line-m{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;line-height:1.2}
.ws-line-r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ws-act{color:#fff;border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:600;white-space:nowrap;flex-shrink:0}
.ws-time{color:#9a8a82;font-size:.76rem;white-space:nowrap}
.ws-dur b{color:var(--bordeaux,#490F25)}
.ws-pause{color:#c0392b;font-size:.66rem;white-space:nowrap}
.ws-cost{font-weight:600;color:#490F25;white-space:nowrap}
.ws-del{cursor:pointer;opacity:.5;font-size:.85rem;flex-shrink:0}
.ws-del:active{opacity:1}
/* ---- Autocomplete adresses (personnalisé, fiable iOS) ---- */
.ac-wrap{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:50;background:#fff;
  border:1.5px solid #e0d5c5;border-radius:12px;box-shadow:0 8px 24px rgba(73,15,37,.14);
  max-height:240px;overflow-y:auto;padding:4px}
.ac-item{padding:10px 12px;border-radius:8px;font-size:.9rem;color:#3a2a2e;cursor:pointer;line-height:1.3}
.ac-item:hover,.ac-item:active{background:#fbf4ec;color:var(--bordeaux,#490F25)}
/* ---- Section dépliable (livraison dans le formulaire commande) ---- */
.collapse-sec{border:1px solid #e8dccd;border-radius:13px;margin:14px 0;overflow:hidden;background:#fdfaf5}
.collapse-head{width:100%;appearance:none;border:none;background:#f6efe4;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:13px 15px;font-family:inherit;font-size:.92rem;font-weight:600;color:var(--bordeaux,#490F25);
  -webkit-tap-highlight-color:transparent;text-align:left}
.collapse-head:active{background:#efe6d8}
.collapse-hint{font-weight:400;font-size:.78rem;color:#9a8a82}
.collapse-arrow{font-size:.8rem;color:var(--caramel,#AA7C39);flex-shrink:0}
.collapse-body{padding:14px 15px 4px}
/* ---- Carnet d'adresses ---- */
.ab-list{display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto}
.ab-card{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border:1px solid #ece3d5;border-radius:13px;padding:12px 14px;background:#fff}
.ab-main{flex:1;min-width:0}
.ab-nom{font-size:.95rem;color:var(--bordeaux,#490F25)}
.ab-meta{color:#8a7a72;font-size:.82rem;margin-top:2px}
.ab-note{color:#9a8a82;font-size:.78rem;margin-top:3px}
.ab-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.ac-item.ac-book{display:flex;align-items:center;gap:6px}
.ac-item.ac-book b{color:var(--bordeaux,#490F25)}
.ac-item .ac-meta{color:#9a8a82;font-size:.76rem;margin-left:auto}
/* ===== MODULE ATELIER DE PRODUCTION ===== */
.prodb-empty{text-align:center;padding:40px 20px;background:#fff;border:1px solid #ece3d5;border-radius:18px;box-shadow:0 2px 12px rgba(73,15,37,.05)}
.prodb-empty-ico{font-size:3rem;margin-bottom:10px}
.prodb-empty p{color:#6a5a52;margin-bottom:14px}
.prodb-session{margin-bottom:14px}
.prodb-sess-head{display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(135deg,#490F25,#6a1d38);color:#EBDFCB;border-radius:14px;padding:12px 15px;font-size:.92rem;font-weight:600}
.prodb-sess-time{font-weight:400;font-size:.8rem;opacity:.85;margin-left:6px}
.prodb-live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#3fb968;margin-right:6px;animation:plpulse 1s ease-in-out infinite;vertical-align:middle}
.prodb-running{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.prodt-card{background:#fff;border:1px solid #ece3d5;border-left:4px solid #8a7a72;border-radius:14px;padding:13px 15px;box-shadow:0 2px 8px rgba(73,15,37,.05)}
.prodt-card.is-paused{opacity:.7;background:#faf6f0}
.prodt-top{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.prodt-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.prodt-label{font-weight:600;color:var(--bordeaux,#490F25);font-size:.92rem;line-height:1.25}
.prodt-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}
.prodt-chrono{font-family:'Bellota','Bellota',serif;font-weight:600;font-size:1.5rem;color:var(--bordeaux,#490F25);font-variant-numeric:tabular-nums}
.prodt-ctrl{display:flex;gap:7px}
.pt-btn{border:none;cursor:pointer;width:38px;height:38px;border-radius:50%;color:#fff;font-size:.9rem;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.pt-pause{background:radial-gradient(circle at 35% 30%,#f5c45e,#d8932a)}
.pt-stop{background:radial-gradient(circle at 35% 30%,#ef7e6e,#c23a2a)}
.pt-del{background:radial-gradient(circle at 35% 30%,#cfc3b4,#9a8a7a);font-size:.78rem}
.pt-edit{background:radial-gradient(circle at 35% 30%,#7fb0c9,#4a7e9a);font-size:.82rem}
.prodt-pausetag{margin-top:8px;font-size:.74rem;color:#d8932a;font-weight:600}
.prodb-addbtn{width:100%;margin-bottom:14px}
.prodb-done{background:#fff;border:1px solid #ece3d5;border-radius:14px;padding:12px 15px;box-shadow:0 2px 8px rgba(73,15,37,.04)}
.prodb-done-head{font-weight:600;color:#3f7d52;font-size:.86rem;margin-bottom:9px}
.prodb-done-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid #f4ede2;font-size:.86rem}
.prodb-done-row:last-child{border-bottom:none}
.prodb-done-row .pd-label{flex:1;color:#5a4a44}
.prodb-done-row .pd-dur{font-weight:600;color:var(--bordeaux,#490F25);white-space:nowrap}
/* Sélecteur de tâche */
.ptp-list{display:flex;flex-direction:column;gap:14px;max-height:50vh;overflow-y:auto;margin:10px 0}
.ptp-group .ptp-phase{font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.ptp-tasks{display:flex;flex-direction:column;gap:6px}
.ptp-task{text-align:left;background:#fff;border:1px solid #ece3d5;border-radius:10px;padding:11px 13px;font-size:.88rem;color:#3a2a2e;cursor:pointer;font-family:inherit}
.ptp-task:active{background:#fbf4ec}
/* Onglets Atelier */
.atelier-tabs{display:flex;gap:8px;margin-bottom:16px}
.at-tab{flex:1;appearance:none;border:1.5px solid #e0d5c5;background:#fff;cursor:pointer;border-radius:11px;padding:10px;font-family:inherit;font-weight:600;font-size:.88rem;color:#8a7a72;-webkit-tap-highlight-color:transparent}
.at-tab.active{background:var(--bordeaux,#490F25);color:var(--creme,#E8DDCD);border-color:var(--bordeaux,#490F25)}
/* Tableau blanc (Gantt) */
.gantt-wrap{background:#fff;border:1px solid #ece3d5;border-radius:16px;padding:14px;box-shadow:0 2px 12px rgba(73,15,37,.05);overflow:hidden}
.gantt-sess{font-family:'Bellota','Bellota',serif;font-weight:600;color:var(--bordeaux,#490F25);font-size:1rem;margin-bottom:12px}
.gantt-scale{display:flex;align-items:flex-end;margin-bottom:6px}
.gantt-corner{flex-shrink:0}
.gantt-axis{position:relative;height:18px}
.gantt-tick{position:absolute;transform:translateX(-50%);font-size:.66rem;color:#9a8a82;white-space:nowrap;bottom:0}
.gantt-rows{display:flex;flex-direction:column;gap:7px}
.gantt-row{display:flex;align-items:center;gap:8px}
.gantt-label{flex-shrink:0;width:34%;max-width:150px;font-size:.74rem;color:#5a4a44;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt-label .prodt-dot{width:9px;height:9px;flex-shrink:0}
.gantt-track{position:relative;flex:1;height:26px;background:#f7f2ea;border-radius:7px;overflow:hidden}
.gantt-grid{position:absolute;top:0;bottom:0;width:1px;background:rgba(170,124,57,.13)}
.gantt-bar{position:absolute;top:3px;bottom:3px;border-radius:6px;min-width:6px;display:flex;align-items:center;padding:0 6px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.gantt-bar.is-running{background-image:linear-gradient(45deg,rgba(255,255,255,.25) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.25) 50%,rgba(255,255,255,.25) 75%,transparent 75%);background-size:14px 14px;animation:ganttStripes 1s linear infinite}
.gantt-bar-txt{font-size:.64rem;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes ganttStripes{0%{background-position:0 0}100%{background-position:14px 0}}
.gantt-hint{margin-top:12px;font-size:.76rem}
/* Journal de bord atelier */
.pj-list{display:flex;flex-direction:column;gap:12px}
.pj-card{background:#fff;border:1px solid #ece3d5;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(73,15,37,.05)}
.pj-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;cursor:pointer}
.pj-date{font-family:'Bellota','Bellota',serif;font-weight:600;color:var(--bordeaux,#490F25);font-size:.98rem;text-transform:capitalize}
.pj-live{color:#3fb968;font-size:.74rem;font-weight:600;margin-left:4px}
.pj-time{color:#9a8a82;font-size:.78rem;margin-top:2px}
.pj-tot{font-family:'Bellota','Bellota',serif;font-weight:700;color:var(--caramel,#AA7C39);font-size:1.2rem;white-space:nowrap}
.pj-chips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.pj-chip{color:#fff;font-size:.68rem;font-weight:600;padding:3px 9px;border-radius:999px}
.pj-actions{display:flex;gap:8px;padding-top:10px;border-top:1px dashed #ece3d5}
/* Petit « i » d'aide à côté des KPI */
.kpi-i{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:50%;border:1.2px solid var(--caramel,#AA7C39);background:transparent;
  color:var(--caramel,#AA7C39);font-size:.62rem;font-weight:700;font-style:italic;font-family:Georgia,serif;
  cursor:pointer;vertical-align:middle;line-height:1;padding:0;margin-left:4px;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;transition:.15s}
.kpi-i:active{background:var(--caramel,#AA7C39);color:#fff}
/* ===== GUIDE INTERACTIF ===== */
.guide-intro{background:linear-gradient(135deg,#fbf4ec,#f5ece0);border:1px solid #ece3d5;border-radius:14px;padding:14px 16px;font-size:.9rem;color:#6a5a52;margin-bottom:18px;line-height:1.5}
.guide-list{display:flex;flex-direction:column;gap:20px}
.guide-theme{}
.guide-th-head{display:flex;align-items:center;gap:10px;padding:8px 0 8px 12px;margin-bottom:10px}
.guide-th-emo{font-size:1.3rem}
.guide-th-title{font-family:'Bellota','Bellota',serif;font-weight:600;color:var(--bordeaux,#490F25);font-size:1.15rem;flex:1}
.guide-th-count{background:#ece3d5;color:#8a7a72;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px}
.guide-items{display:flex;flex-direction:column;gap:9px}
.guide-card{background:#fff;border:1px solid #ece3d5;border-radius:14px;overflow:hidden;transition:box-shadow .15s}
.guide-card.open{box-shadow:0 4px 16px rgba(73,15,37,.1)}
.guide-card-head{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.guide-ico{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.guide-card-txt{flex:1;min-width:0}
.guide-card-t{font-weight:600;color:var(--bordeaux,#490F25);font-size:.96rem}
.guide-card-r{font-size:.8rem;color:#9a8a82;margin-top:2px;line-height:1.35}
.guide-chev{color:var(--caramel,#AA7C39);font-size:.85rem;flex-shrink:0;transition:transform .15s}
.guide-card-body{padding:0 15px 15px;border-top:1px solid #f4ede2}
.guide-detail{color:#5a4a44;font-size:.9rem;line-height:1.6;margin:12px 0}
.guide-steps{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.guide-step{display:flex;align-items:flex-start;gap:10px;font-size:.88rem;color:#5a4a44;line-height:1.4}
.guide-step-n{flex-shrink:0;width:22px;height:22px;border-radius:50%;color:#fff;font-size:.74rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.guide-go{width:100%;color:#fff!important}
/* Comparateur de marge par emballage */
.pmc-list{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.pmc-card{border:1px solid #ece3d5;border-radius:14px;padding:14px;background:#fff;box-shadow:0 2px 8px rgba(73,15,37,.04)}
.pmc-card-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.pmc-card-nom{font-family:'Bellota','Bellota',serif;font-weight:600;color:var(--bordeaux,#490F25);font-size:1.02rem}
.pmc-card-cap{font-size:.76rem;color:#9a8a82;white-space:nowrap}
.pmc-card-inputs{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.pmc-in{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pmc-in-lbl{font-size:.86rem;color:#6a5a52;font-weight:500}
.pmc-in-box{display:flex;align-items:center;gap:5px;background:#faf6f0;border:1.5px solid #e0d5c5;border-radius:10px;padding:0 11px;width:130px}
.pmc-in-box input{border:none;background:transparent;padding:10px 0;font-size:.95rem;font-family:inherit;width:100%;text-align:right;outline:none;-moz-appearance:textfield}
.pmc-in-box input::-webkit-outer-spin-button,.pmc-in-box input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pmc-in-unit{color:#9a8a82;font-size:.9rem;flex-shrink:0}
.pmc-card-res{border-top:1px dashed #ece3d5;padding-top:11px}
.pmc-res-line{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pmc-res-marge{font-family:'Bellota','Bellota',serif;font-weight:700;font-size:1.5rem}
.pmc-res-taux{color:#fff;font-size:.82rem;font-weight:700;padding:3px 12px;border-radius:999px}
.pmc-res-detail{font-size:.72rem;color:#b0a193;margin-top:6px;text-align:center}
.pmc-empty{color:#c9bcae;font-size:.84rem;font-style:italic}
/* Cartes Fournisseurs */
.sup-list{display:flex;flex-direction:column;gap:10px}
.sup-card{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid #ece3d5;border-radius:13px;padding:13px 15px;background:#fff}
.sup-card-main{flex:1;min-width:0}
.sup-card-nom{font-weight:600;color:var(--bordeaux,#490F25);font-size:.98rem}
.sup-card-contact{color:#9a8a82;font-size:.82rem;margin-top:3px;word-break:break-word}
.sup-card-actions{display:flex;gap:6px;flex-shrink:0}
/* Cartes Clients */
.cl-list{display:flex;flex-direction:column;gap:10px}
.cl-card{border:1px solid #ece3d5;border-radius:13px;padding:13px 15px;background:#fff;cursor:pointer;transition:box-shadow .15s}
.cl-card:active{box-shadow:0 2px 10px rgba(73,15,37,.08)}
.cl-card-head{display:flex;align-items:center;gap:8px;justify-content:space-between}
.cl-card-nom{font-weight:600;color:var(--bordeaux,#490F25);font-size:.98rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-card-contact{color:#9a8a82;font-size:.82rem;margin-top:5px;word-break:break-word}
.cl-card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid #f4ede2}
.cl-card-stat{font-size:.8rem;color:#8a7a72}
.cl-card-ca{font-family:'Bellota','Bellota',serif;font-weight:600;color:var(--caramel,#AA7C39);font-size:1.05rem}
.cl-card-actions{display:flex;gap:6px;margin-top:10px}
/* Lignes d'ingrédients de recette (remplace le tableau) */
.ing-list{display:flex;flex-direction:column;border:1px solid #ece3d5;border-radius:11px;overflow:hidden}
.ing-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 13px;background:#f6efe4;font-size:.74rem;font-weight:600;color:#9a8a82}
.ing-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 13px;border-top:1px solid #f4ede2}
.ing-nom{flex:1;min-width:0;font-size:.88rem;color:#3a2a2e;word-break:break-word}
.ing-nom-h{flex:1}
.ing-tag{color:#9a8a82;font-size:.72rem;margin-left:5px}
.ing-qtes{display:flex;gap:14px;flex-shrink:0;text-align:right}
.ing-base{color:#9a8a82;font-size:.82rem;min-width:62px;display:inline-block}
.ing-mult{color:var(--bordeaux,#490F25);font-size:.88rem;min-width:66px;display:inline-block}
/* Cartes Coûts & prix */
.cost-list{display:flex;flex-direction:column;gap:10px}
.cost-card{border:1px solid #ece3d5;border-radius:12px;padding:12px 14px;background:#fff}
.cost-card-nom{font-weight:600;color:var(--bordeaux,#490F25);font-size:.94rem;margin-bottom:8px}
.cost-card-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0;font-size:.86rem}
.cost-lbl{color:#8a7a72}
.cost-val{color:#3a2a2e;font-weight:500}
.cost-strong{font-weight:700;color:var(--bordeaux,#490F25)}
/* Cartes Suivi DLC */
.dlc-list{display:flex;flex-direction:column;gap:9px}
.dlc-card{border:1px solid #ece3d5;border-radius:12px;padding:11px 13px;background:#fff}
.dlc-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.dlc-nom{font-weight:600;color:var(--bordeaux,#490F25);font-size:.92rem}
.dlc-card-info{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:#8a7a72}
/* Lignes Traçabilité */
.trace-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){ .trace-grid{grid-template-columns:1fr;gap:14px} }
.trace-list{display:flex;flex-direction:column;gap:8px}
.trace-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid #ece3d5;border-radius:10px;background:#fff}
.trace-row-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.trace-date{font-size:.74rem;color:#9a8a82}
.trace-nom{font-weight:600;color:var(--bordeaux,#490F25);font-size:.88rem;word-break:break-word}
.trace-sub{font-size:.74rem;color:#9a8a82}
.trace-row-acts{display:flex;gap:6px;flex-shrink:0}
/* ---- Vue d'impression intégrée (facture, étiquettes…) ---- */
#printView{position:fixed;inset:0;z-index:9999;background:#5a5048;display:flex;flex-direction:column}
#printView .pv-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--bordeaux,#490F25);color:var(--creme,#E8DDCD);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#printView .pv-title{font-weight:600;font-size:.92rem;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#printView .pv-btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:600;
  font-size:.88rem;padding:9px 15px;border-radius:10px;-webkit-tap-highlight-color:transparent;flex-shrink:0}
#printView .pv-close{background:rgba(232,221,205,.16);color:var(--creme,#E8DDCD)}
#printView .pv-print{background:var(--caramel,#AA7C39);color:#fff}
#printView a.pv-btn{display:inline-flex;align-items:center;text-decoration:none;background:rgba(232,221,205,.16);color:var(--creme,#E8DDCD)}
#printView .pv-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#e8e2da;display:flex;justify-content:center;padding:14px}
#printView iframe{width:100%;max-width:820px;height:100%;border:none;background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.2);border-radius:4px}
@media print{
  body>*:not(#printView){display:none!important}
  #printView{position:static;background:#fff}
  #printView .pv-bar{display:none!important}
  #printView .pv-body{padding:0;overflow:visible}
  #printView iframe{box-shadow:none;border-radius:0;max-width:none}
}
/* ---- Liste de courses ---- */
.shop-list{display:flex;flex-direction:column;gap:8px;max-height:54vh;overflow-y:auto;margin:10px 0}
.shop-line{display:flex;gap:10px;align-items:flex-start;border:1px solid #ece3d5;border-radius:12px;padding:10px 12px;background:#fff}
.shop-chk{font-size:1.1rem;color:#b8a88f;flex-shrink:0;line-height:1.3}
.shop-main{flex:1;min-width:0}
.shop-name{font-size:.95rem;color:var(--ink,#490F25)}
.shop-sub{color:#8a7a72;font-size:.78rem;margin-top:2px}
.shop-sup{font-size:.82rem;margin-top:4px;color:#5a4a44}
.shop-sup b{color:var(--bordeaux,#490F25)}
/* ---- Cartes Production ---- */
.prod-cards{display:flex;flex-direction:column;gap:0}
.prod-sec-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-family:'Bellota',serif;font-weight:600;font-size:1.15rem;color:var(--bordeaux,#490F25);margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid #ece3d5}
.prod-sec-head:first-child{margin-top:4px}
.prod-sec-head .sec-count{font-family:'Outfit',sans-serif;font-weight:400;font-size:.82rem;color:#9a8a82}
.prod-card{border:1px solid #ece3d5;border-radius:16px;padding:14px 16px 12px;background:#fff;box-shadow:0 2px 8px rgba(73,15,37,.05);margin-bottom:12px}
.prod-card-live{padding:0;overflow:hidden}
.prod-card-live .prod-card-body{padding:14px 16px 12px}
/* Barre verte LIVE en EN-TÊTE soudée (avec nom de la prod) */
.prod-live{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#2e9d52,#3fb968);color:#fff;padding:11px 15px;box-shadow:0 2px 8px rgba(46,157,82,.25)}
.prod-card-live .prod-live{border-radius:15px 15px 0 0}
.prod-live .pl-dot{width:11px;height:11px;border-radius:50%;background:#fff;flex-shrink:0;animation:plpulse 1s ease-in-out infinite}
.prod-live .pl-name{font-weight:700;font-size:.92rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-live .prod-chrono{margin-left:auto;font-family:'Courier New',monospace;font-weight:700;font-size:1.2rem;letter-spacing:.04em;font-variant-numeric:tabular-nums;flex-shrink:0}
.prod-live-over{background:linear-gradient(90deg,#c0392b,#e05a48);box-shadow:0 2px 8px rgba(192,57,43,.25)}
@keyframes plpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.prod-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
.prod-lot{text-align:right;font-size:.92rem}
.prod-lot b{color:var(--bordeaux,#490F25)}
.prod-base{color:#9a8a82;font-size:.68rem}
.prod-card-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:.76rem;color:#9a8a82;margin-bottom:10px}
.prod-card-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:9px 11px;background:#fbf6ef;border-radius:11px;font-size:.78rem;color:#7a6a62;margin-bottom:10px}
.prod-card-stats b{color:var(--bordeaux,#490F25);font-size:.9rem;display:block}
.prod-unit{color:#9a8a82;font-size:.64rem}
.prod-loss{margin-bottom:8px}
.prod-card-status{margin-bottom:11px;font-size:.86rem}
.prod-card-actions{display:flex;gap:7px;flex-wrap:wrap;padding-top:11px;border-top:1px dashed #ece3d5}
.sum-box b{color:var(--bordeaux)}
/* HORODATEUR GLOBAL — discret, fixe en haut à droite, présent sur toutes les pages.
   Semi-transparent et non cliquable pour ne pas gêner ; passe sous les modales (z-index modéré). */
.clock{position:fixed;top:8px;right:12px;z-index:30;pointer-events:none;
  font-family:'Outfit',system-ui,sans-serif;font-size:.72rem;line-height:1.15;text-align:right;
  color:var(--bordeaux);opacity:.62;font-variant-numeric:tabular-nums;letter-spacing:.01em;
  background:rgba(253,251,247,.72);border:1px solid rgba(170,124,57,.18);border-radius:9px;
  padding:4px 9px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  box-shadow:0 1px 4px rgba(73,15,37,.06);user-select:none;max-width:46vw}
.clock .c-date{display:block;font-size:.66rem;color:#8a7a72;text-transform:capitalize}
.clock .c-time{display:block;font-weight:600;font-size:.82rem}
/* iPhone : laisse respirer sous l'encoche/barre d'état (safe-area) */
@supports(padding:max(0px)){ .clock{top:max(8px, env(safe-area-inset-top))} }
/* TABLEAU DE BORD — paire d'encarts (Matières à réappro / Prochaines échéances).
   2 colonnes quand il y a la place, 1 seule colonne dès que c'est étroit
   (auto-fit + minmax évite que les tableaux soient écrasés et coupés). */
.dash-2col{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
/* tableaux des deux encarts : la colonne « nom » peut revenir à la ligne
   au lieu de déborder ; les colonnes chiffres/tags restent sur une ligne. */
.dash-tbl{width:100%;table-layout:auto}
.dash-tbl td{padding:9px 8px;vertical-align:middle}
.dash-tbl td.nm{word-break:break-word;line-height:1.25;font-weight:500;color:var(--bordeaux)}
.dash-tbl tr+tr td{border-top:1px solid var(--hair)}
/* RACCOURCIS cliquables (comptabilité & co) : un chevron « › » caramel signale le lien.
   On ne souligne pas le chiffre ; on ajoute le marqueur à côté. */
.lnk{cursor:pointer;transition:.12s}
.lnk:hover,.lnk:active{filter:brightness(.98);background-image:linear-gradient(135deg,#f0e7d6,#e9dfcc)}
.kpi.lnk:hover,.kpi.lnk:active{border-color:var(--caramel);box-shadow:0 0 0 2px rgba(170,124,57,.18)}
.lnk .nav-go{color:var(--caramel);font-weight:700;font-size:1.05em;margin-left:7px;flex:none;line-height:1}

/* ---- Pointeuse de laboratoire (time tracker global) ---- */
/* ===== POINTEUSE — feu tricolore flottant déplaçable + fouets animés ===== */
#timeTracker{display:none !important}
#timeTracker.legacy-show{position:fixed;z-index:46;left:246px;bottom:18px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:transparent;border:none;border-radius:18px;
  padding:0;box-shadow:none;
  font-family:'Outfit',system-ui,sans-serif;touch-action:none;user-select:none;cursor:grab;transition:gap .15s}
#timeTracker.dragging{cursor:grabbing;opacity:.92}
/* poignée + bouton historique masqués au repos, révélés quand déployé */
#timeTracker .tt-grip{font-size:.7rem;color:#8a7d70;letter-spacing:.15em;line-height:1;display:none;opacity:.7}
#timeTracker .tt-light{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;position:relative;transition:.15s;
  display:flex;align-items:center;justify-content:center;font-size:1.05rem}
#timeTracker .tt-light.green{background:radial-gradient(circle at 35% 30%,#7bd88f,#2e9c4d);box-shadow:0 3px 10px rgba(46,156,77,.5)}
#timeTracker .tt-light.green:active{transform:scale(.92)}
#timeTracker .tt-light.dim{background:linear-gradient(135deg,#caa23b,#9a7320);box-shadow:0 3px 10px rgba(154,115,32,.45);cursor:pointer;display:none}
#timeTracker .tt-light.dim span{opacity:1}
/* état déployé : fond, poignée et 2e bouton visibles, feu agrandi */
#timeTracker.tt-open{background:#2c2420;border:2px solid #1c1714;padding:9px 8px;box-shadow:0 10px 30px rgba(0,0,0,.32)}
#timeTracker.tt-open .tt-grip{display:block}
#timeTracker.tt-open .tt-light{width:46px;height:46px;font-size:1.25rem}
#timeTracker.tt-open .tt-light.dim{display:flex}
#timeTracker .tt-histlabel{display:none;font-size:.62rem;color:#e8dccd;letter-spacing:.08em;text-transform:uppercase;line-height:1}
#timeTracker.tt-open .tt-histlabel{display:block}
#ttWhisks{position:fixed;z-index:45;left:auto;right:24px;bottom:24px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none;max-width:min(360px,calc(100vw - 24px))}
#ttWhisks .tt-whisk{pointer-events:auto;display:flex;align-items:center;gap:8px;
  background:#fff;border:1px solid rgba(170,124,57,.25);border-left:4px solid var(--tt-col,#AA7C39);border-radius:13px;padding:6px 10px;
  box-shadow:0 6px 20px rgba(82,37,47,.2);font-family:'Outfit',system-ui,sans-serif;cursor:grab;touch-action:none}
#ttWhisks .tt-whisk.dragging{cursor:grabbing;opacity:.92}
#ttWhisks .tt-whisk.paused{opacity:.72}
#ttWhisks .whisk-ico{width:30px;height:24px;display:inline-block;transform-origin:50% 50%;animation:whiskBeat .9s ease-in-out infinite}
#ttWhisks .tt-whisk.paused .whisk-ico{animation:none;filter:grayscale(.6)}
@keyframes whiskBeat{0%,100%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(9deg) translateY(-1px)}}
#ttWhisks .whisk-lbl{font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:#9a8a82;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;align-self:center}
#ttWhisks .whisk-time{font-family:'Bellota',serif;font-size:.95rem;font-weight:600;color:var(--bordeaux);font-variant-numeric:tabular-nums}
#ttWhisks .whisk-ctrl{display:none;align-items:center;gap:5px;margin-left:4px}
#ttWhisks .tt-whisk.open .whisk-ctrl{display:flex}
#ttWhisks .whisk-ctrl button{appearance:none;-webkit-appearance:none;border:none;cursor:pointer;
  width:30px;height:30px;border-radius:50%;color:#fff;font-size:.8rem;-webkit-tap-highlight-color:transparent}
#ttWhisks .whisk-ctrl .wc-pause{background:radial-gradient(circle at 35% 30%,#f5c45e,#d8932a)}
#ttWhisks .whisk-ctrl .wc-cancel{background:radial-gradient(circle at 35% 30%,#cfc3b4,#9a8a7a);font-size:.72rem}
#ttWhisks .whisk-ctrl .wc-stop{background:radial-gradient(circle at 35% 30%,#ef7e6e,#c23a2a)}
@media(max-width:820px){
  #timeTracker{left:auto;right:12px;bottom:calc(150px + env(safe-area-inset-bottom))}
  #ttWhisks{left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));align-items:flex-start}
  #ttWhisks .tt-whisk{max-width:100%}
  #ttWhisks .whisk-lbl{max-width:90px}
}
}
/* ---- Module Préparation / Picking (gros blocs tactiles) ---- */
.pick-tabs{display:flex;gap:8px;margin-bottom:16px}
.pick-tabs button{flex:1;appearance:none;-webkit-appearance:none;cursor:pointer;border:1.5px solid #e0d5c5;
  background:#fff;color:var(--bordeaux);font-family:inherit;font-weight:600;font-size:.92rem;
  padding:13px;border-radius:12px;-webkit-tap-highlight-color:transparent}
.pick-tabs button.active{background:var(--bordeaux);color:var(--creme);border-color:var(--bordeaux)}
.pick-date{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pick-date input[type=date]{flex:1;min-width:160px;font-size:1rem;padding:12px;border:1.5px solid #e0d5c5;border-radius:12px;font-family:inherit}
/* Ligne de picking : un gros bloc tactile, rouge (à faire) → vert (fait) */
.pick-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:#fff;border:2px solid #f0cfc9;border-left:6px solid var(--red,#b04a3e);
  border-radius:14px;padding:16px 16px;margin-bottom:10px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:.15s;min-height:64px}
.pick-row:active{transform:scale(.99)}
.pick-row.done{border-color:#bfe0c8;border-left-color:var(--green,#3f7d52);background:#f3faf5}
.pick-check{width:30px;height:30px;border-radius:8px;border:2px solid var(--red,#b04a3e);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff;font-weight:700}
.pick-row.done .pick-check{background:var(--green,#3f7d52);border-color:var(--green,#3f7d52)}
.pick-main{flex:1;min-width:0}
.pick-name{font-size:1.08rem;font-weight:600;color:var(--ink);line-height:1.2}
.pick-row.done .pick-name{text-decoration:line-through;color:#8a9a8e}
.pick-sub{font-size:.8rem;color:#9a8a82;margin-top:2px}
.pick-qty{font-family:'Bellota',serif;font-size:1.5rem;font-weight:600;color:var(--bordeaux);flex-shrink:0}
.pick-row.done .pick-qty{color:var(--green,#3f7d52)}
.pick-zone-head{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--bordeaux);
  font-size:.92rem;margin:14px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--creme)}
.pick-scan{appearance:none;-webkit-appearance:none;border:1.5px solid #d9c8e0;background:#fff;color:#7a4b82;
  border-radius:10px;padding:8px 10px;font-size:1.05rem;cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.pick-order-card{background:#fff;border-radius:16px;box-shadow:0 4px 20px var(--shadow);
  border:1px solid rgba(170,124,57,.12);padding:18px;margin-bottom:16px}
.pick-order-card.ready{border:2px solid var(--green,#3f7d52)}
.pick-order-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pick-order-head h3{color:var(--bordeaux);font-size:1.15rem}
.pick-progress{height:8px;border-radius:5px;background:#f0eae0;overflow:hidden;margin-bottom:14px}
.pick-progress span{display:block;height:100%;background:var(--green,#3f7d52);transition:width .25s}
.pick-big-btn{width:100%;padding:16px;font-size:1rem;font-weight:700;border-radius:12px;border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:8px}
.pick-big-btn.ready{background:var(--green,#3f7d52);color:#fff}
.pick-big-btn.wait{background:#f0eae0;color:#9a8a82}
/* ---- Assistant : jauge de sérénité + cartes anti-gaspi ---- */
.serenity{padding:18px}
.ser-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ser-title{font-weight:600;color:var(--bordeaux);font-size:1.05rem}
.ser-score{font-family:'Bellota',serif;font-weight:600;font-size:1.05rem}
.ser-bar{position:relative;height:16px;border-radius:9px;background:#efe7da;overflow:hidden}
.ser-bar>span{display:block;height:100%;border-radius:9px;transition:width .5s ease}
.ser-bar>i{position:absolute;top:-3px;height:22px;width:3px;background:#2b1a1f;border-radius:2px;transition:left .5s ease}
.ser-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.82rem;color:#7a6a62;margin-top:8px}
.ser-markets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gaspi-card{background:#fff;border:1px solid rgba(170,124,57,.14);border-left:5px solid #d98324;
  border-radius:12px;padding:14px;margin-bottom:10px}
.gaspi-head{font-size:1rem;color:var(--ink);margin-bottom:4px}
.gaspi-body{font-size:.88rem;color:#6a5a52;line-height:1.4}
.gaspi-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
/* ---- Mascotte chat (reflet de la jauge de sérénité) ---- */
#mascot{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));top:auto;z-index:47;
  width:140px;height:140px;min-width:140px;max-width:140px;min-height:140px;max-height:140px;background:transparent;border:none;
  filter:drop-shadow(0 5px 8px rgba(82,37,47,.28));
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;transition:opacity .2s,transform .12s;user-select:none;
  animation:macaronBob 3.4s ease-in-out infinite}
#mascot .mascot-face{width:131px;height:131px;flex:none;pointer-events:none}
#mascot .mascot-bubble{position:absolute;bottom:calc(100% + 6px);right:6px;width:max-content;max-width:200px;flex:none;
  background:#fff;color:var(--bordeaux);border:1px solid var(--hair);border-radius:14px;
  padding:9px 12px;font-size:.8rem;line-height:1.25;box-shadow:0 6px 18px rgba(82,37,47,.16);
  pointer-events:auto;cursor:pointer;animation:mascotBubbleIn .4s ease both;z-index:1}
#mascot .mascot-bubble::after{content:"";position:absolute;top:100%;right:30px;border:7px solid transparent;border-top-color:#fff}
@keyframes mascotBubbleIn{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
#mascot .mascot-badge{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  font-size:.6rem;font-weight:700;color:#fff;background:var(--mascot-col,#3f7d52);border-radius:9px;
  padding:1px 6px;line-height:1.3;box-shadow:0 2px 6px rgba(0,0,0,.18);pointer-events:none;white-space:nowrap}
#mascot.dragging{cursor:grabbing;opacity:.55;transform:scale(1.05);animation:none}
#mascot:active{transform:scale(.96)}
/* léger flottement permanent (vivant) */
@keyframes macaronBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* tremblement en zone de stress */
#mascot.alarm{animation:mascotShake 2.4s ease-in-out infinite}
@keyframes mascotShake{0%,92%,100%{transform:translateX(0)}94%{transform:translateX(-2px)}96%{transform:translateX(2px)}98%{transform:translateX(-1px)}}
@media (prefers-reduced-motion: reduce){ #mascot.alarm,#mascot{animation:none} }
/* s'estompe quand l'utilisateur survole/approche pour ne pas gêner la lecture */
#mascot:hover{opacity:.35}
@media(max-width:820px){ #mascot{width:126px;height:126px;min-width:126px;max-width:126px;min-height:126px;max-height:126px;right:12px;top:auto;bottom:calc(94px + env(safe-area-inset-bottom,0px))} #mascot .mascot-face{width:119px;height:119px} }
/* ---- HACCP / PMS : relevés de température ---- */

.pms-periode button{flex:1;appearance:none;-webkit-appearance:none;cursor:pointer;border:1.5px solid #e0d5c5;
