  --bordeaux:#52252F; --bordeaux-2:#6e3340; --bordeaux-3:#3d1a22; --creme:#E8DDCD; --creme-2:#F5F0E8;
  --caramel:#AA7C39; --caramel-2:#c6974f; --gold:#AA7C39; --ink:#2b1a1f; --paper:#fbf8f3;
  --green:#3f7d52; --red:#b04a3e; --shadow:rgba(82,37,47,.12);
  /* tokens esthétiques */
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:22px;
  --sh-1:0 1px 2px rgba(82,37,47,.04), 0 2px 8px rgba(82,37,47,.06);
  --sh-2:0 4px 14px rgba(82,37,47,.08), 0 10px 30px rgba(82,37,47,.07);
  --sh-3:0 10px 30px rgba(82,37,47,.12), 0 24px 60px rgba(82,37,47,.10);
  --hair:rgba(170,124,57,.16);
  --grad-bordeaux:linear-gradient(155deg,var(--bordeaux-2),var(--bordeaux) 55%,var(--bordeaux-3));
  --grad-gold:linear-gradient(135deg,var(--caramel-2),var(--caramel));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);
  background-image:
    radial-gradient(1200px 600px at 8% -5%,rgba(170,124,57,.10),transparent 55%),
    radial-gradient(1000px 700px at 105% 110%,rgba(82,37,47,.08),transparent 55%),
    radial-gradient(circle at 50% 40%,rgba(255,255,255,.5),transparent 70%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;letter-spacing:.002em}
h1,h2,h3,.serif{font-family:'Fraunces','Georgia','Times New Roman',serif;letter-spacing:-.01em}
.app{display:flex;min-height:100vh;width:100%;overflow-x:hidden}
.side{width:236px;background:var(--grad-bordeaux);
  color:var(--creme);padding:26px 16px;position:fixed;height:100vh;display:flex;flex-direction:column;gap:4px;z-index:10;
  box-shadow:inset -1px 0 0 rgba(0,0,0,.18), 4px 0 30px rgba(82,37,47,.14)}
.side::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(420px 220px at 30% 0%,rgba(198,151,79,.16),transparent 60%);opacity:.9}
.brand{font-family:'Fraunces',serif;font-size:1.45rem;font-weight:600;line-height:1.12;margin-bottom:4px;position:relative}
.brand small{display:block;font-family:'Outfit';font-size:.62rem;letter-spacing:.26em;
  text-transform:uppercase;color:var(--caramel-2);margin-top:8px;font-weight:600}
.brand-rule{height:1px;background:linear-gradient(90deg,transparent,rgba(232,221,205,.4),transparent);margin:16px 0;position:relative}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;position:relative;scrollbar-width:thin}
.nav button{appearance:none;-webkit-appearance:none;background:transparent;border:none;margin:0;
  font-family:inherit;text-align:left;width:100%;cursor:pointer;display:flex;align-items:center;gap:11px;padding:10px 14px;
  border-radius:11px;font-size:.9rem;color:rgba(232,221,205,.82);transition:.2s cubic-bezier(.4,0,.2,1);font-weight:400;-webkit-tap-highlight-color:transparent;position:relative}
.nav button *{pointer-events:none}
.nav button:hover{background:rgba(232,221,205,.12);color:var(--creme);transform:translateX(2px)}
.nav button.active{background:linear-gradient(90deg,rgba(245,240,232,.96),rgba(232,221,205,.9));color:var(--bordeaux);font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.nav button.active::before{content:'';position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:4px;height:60%;border-radius:0 4px 4px 0;background:var(--caramel-2)}
.nav .ico{font-size:1.05rem;width:20px;text-align:center}
.nav .sep{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(232,221,205,.42);padding:14px 14px 4px;font-weight:600}
/* MENU SIMPLIFIÉ : section « Avancé » repliée par défaut (barre latérale + feuille iPhone) */
.nav-adv{display:none}
.nav-adv.open{display:block}
.sheet-grid.nav-adv{display:none}
.sheet-grid.nav-adv.open{display:grid}
.nav .nav-adv-toggle{appearance:none;-webkit-appearance:none;width:100%;text-align:left;border:none;cursor:pointer;
  background:rgba(232,221,205,.07);color:rgba(232,221,205,.75);font-family:inherit;font-weight:600;font-size:.78rem;
  letter-spacing:.08em;text-transform:uppercase;padding:11px 14px;margin-top:12px;border-radius:9px;
  display:flex;align-items:center;gap:9px;-webkit-tap-highlight-color:transparent}
.nav .nav-adv-toggle .adv-chev{transition:transform .2s;display:inline-block;width:20px;text-align:center;color:var(--caramel)}
.nav .nav-adv-toggle.open .adv-chev{transform:rotate(90deg)}
.sheet-adv-toggle{appearance:none;-webkit-appearance:none;width:100%;border:1.5px dashed #d8c9b2;background:#faf6ee;
  color:#8a6d4a;font-family:inherit;font-weight:600;font-size:.85rem;padding:11px;border-radius:11px;cursor:pointer;
  margin:4px 0 10px;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent}
.sheet-adv-toggle .adv-chev{transition:transform .2s;display:inline-block;color:var(--caramel)}
.sheet-adv-toggle.open .adv-chev{transform:rotate(90deg)}
.sheet-adv-toggle .adv-count{font-weight:400;color:#b0a193;font-size:.76rem}
.side-foot{font-size:.66rem;color:rgba(232,221,205,.55);line-height:1.5;margin-top:8px}
.side-foot .foot-help{display:block;margin-bottom:8px}
.side-foot .foot-btn{width:100%;margin-top:6px}
.main{margin-left:236px;flex:1;min-width:0;max-width:calc(100% - 236px);padding:32px 40px 60px;overflow-x:hidden}
@keyframes viewIn{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.main.view-in{ animation:viewIn .28s cubic-bezier(.22,.61,.36,1) }
@media (prefers-reduced-motion: reduce){ .main.view-in{ animation:none } }
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:12px;
  padding-bottom:16px;border-bottom:1px solid var(--hair);position:relative;padding-top:86px}
.topbar::before{content:'';display:block;position:absolute;top:0;left:0;right:0;height:72px;
  background-image:var(--banner);background-size:cover;background-position:center 38%;
  border-radius:14px;box-shadow:0 3px 14px rgba(73,15,37,.16);pointer-events:none}
.topbar h1{font-size:1.95rem;font-weight:600;color:var(--bordeaux);line-height:1.05;letter-spacing:-.01em}
.topbar p{color:#8a7a72;font-size:.9rem;margin-top:4px}

/* Première colonne FIGÉE lors du défilement horizontal (type Excel) :
   la colonne d'identification reste visible. Sa largeur est BORNÉE pour ne pas
   manger l'écran ; un texte long s'enroule sur 2 lignes plutôt que d'allonger la colonne. */
.table-wrap th:first-child,
.table-wrap td:first-child{
  position:sticky; left:0; z-index:2;
  background:#fff;
  border-right:2px solid #e7dcc9; /* séparation nette (plus fiable que box-shadow sur iOS) */
  box-shadow:3px 0 5px rgba(73,15,37,.07);
  max-width:42vw;                 /* ne dépasse jamais ~40% de l'écran */
  white-space:normal;             /* autorise le retour à la ligne */
  overflow-wrap:anywhere;         /* coupe les mots très longs si besoin */
}
.table-wrap thead th:first-child{ z-index:3; background:#fff; }
.table-wrap tr:hover td:first-child{ background:var(--creme-2); }
/* Les lignes paires ont un fond translucide qui, sur la colonne figée, laissait
   voir les cellules défiler au travers (bug iOS). On force un fond OPAQUE dédié. */
.table-wrap tbody tr:nth-child(even) td:first-child{ background:#f5f0e8; }
.table-wrap tbody tr:nth-child(odd) td:first-child{ background:#ffffff; }
/* Désactive la colonne figée quand on ne le souhaite pas (classe .no-freeze). */
.table-wrap.no-freeze th:first-child,
.table-wrap.no-freeze td:first-child{ position:static; box-shadow:none; max-width:none; }

  text-transform:uppercase;letter-spacing:.09em;border-bottom:2px solid var(--creme)}

/* Tag d'emplacement de batch : par défaut (iPad/desktop) on montre le nom complet,

.emp-tag .emp-letter{display:none}

/* BLOC REPLIABLE réutilisable : montre N éléments, le reste masqué derrière un chevron.

.collapse-more{display:none}
.collapse-block.open .collapse-more{display:revert}

.hide{display:none}
.note{font-size:.76rem;color:#9a8a82;margin-top:8px;line-height:1.5}
.banner{background:linear-gradient(135deg,#fcf2df,#f8ead0);border:1px solid var(--caramel);color:#7a5a20;border-radius:var(--r-md);padding:13px 16px;font-size:.83rem;margin-bottom:18px;display:flex;gap:11px;align-items:center;line-height:1.45;box-shadow:var(--sh-1)}
.bom-line{display:grid;grid-template-columns:1fr 78px 56px 96px 88px 28px;gap:7px;align-items:center;margin-bottom:8px}
.bom-line .bom-part{font-size:.8rem;padding:6px 4px}
.bom-line .bom-etiq{font-size:.8rem;padding:6px 8px;border:1.5px solid #e7dccb;border-radius:8px}
@media(max-width:820px){ .bom-line{grid-template-columns:1fr 64px 84px 84px 24px;gap:5px} .bom-line>span:nth-child(3){display:none} }
.bom-line .x{cursor:pointer;color:var(--red);font-weight:700;text-align:center;font-size:1.1rem}
.flav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.flav-row{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #e0d5c5;border-radius:10px;padding:6px 10px}
.flav-row.on{border-color:var(--caramel);background:var(--creme-2)}
.flav-row .nm{flex:1;font-size:.82rem;line-height:1.2}
.flav-row input[type=number]{width:54px;padding:5px;border:1px solid #e0d5c5;border-radius:7px;font-size:14px;text-align:center}
.flav-row input[type=checkbox]{width:auto;flex-shrink:0}
.pill{display:inline-block;background:var(--creme);color:var(--bordeaux);border-radius:14px;padding:2px 9px;font-size:.72rem;margin:2px 2px 0 0}
.sum-box{background:linear-gradient(135deg,var(--creme-2),#f0e8da);border:1px solid var(--hair);border-radius:var(--r-sm);padding:11px 13px;font-size:.84rem;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.pay-summary{background:linear-gradient(135deg,var(--creme-2),#f0e8da);border:1px solid var(--hair);border-radius:var(--r-sm);padding:11px 13px;font-size:.88rem;display:flex;flex-direction:column;gap:5px}
.pay-summary>div{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pay-summary b{color:var(--bordeaux)}
.emp-choices{display:flex;flex-direction:column;gap:8px}
.emp-opt{display:flex;align-items:center;gap:9px;cursor:pointer;border:1.5px solid #e8dccd;border-radius:12px;padding:11px 13px;font-size:.92rem;background:#fff;transition:border-color .15s,background .15s}
.emp-opt:has(input:checked){border-color:var(--bordeaux,#490F25);background:#fbf4ec}
.emp-opt input[type=radio]{width:20px;height:20px;flex-shrink:0;accent-color:var(--bordeaux,#490F25);margin:0}
.emp-opt b{flex-shrink:0}
.emp-opt span{flex:1}
/* ---- Cartes Production ---- */
.prod-cards{display:flex;flex-direction:column;gap:0}
.prod-sec-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;color:var(--bordeaux,#490F25);margin:18px 0 10px;padding-bottom:6px;border-bottom:2px solid #ece3d5}
.prod-sec-head:first-child{margin-top:4px}
.prod-sec-head .sec-count{font-family:'Outfit',sans-serif;font-weight:400;font-size:.82rem;color:#9a8a82}
.prod-card{border:1px solid #ece3d5;border-radius:16px;padding:14px 16px 12px;background:#fff;box-shadow:0 2px 8px rgba(73,15,37,.05);margin-bottom:12px}
.prod-card-live{padding:0;overflow:hidden}
.prod-card-live .prod-card-body{padding:14px 16px 12px}
/* Barre verte LIVE en EN-TÊTE soudée (avec nom de la prod) */
.prod-live{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#2e9d52,#3fb968);color:#fff;padding:11px 15px;box-shadow:0 2px 8px rgba(46,157,82,.25)}
.prod-card-live .prod-live{border-radius:15px 15px 0 0}
.prod-live .pl-dot{width:11px;height:11px;border-radius:50%;background:#fff;flex-shrink:0;animation:plpulse 1s ease-in-out infinite}
.prod-live .pl-name{font-weight:700;font-size:.92rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-live .prod-chrono{margin-left:auto;font-family:'Courier New',monospace;font-weight:700;font-size:1.2rem;letter-spacing:.04em;font-variant-numeric:tabular-nums;flex-shrink:0}
.prod-live-over{background:linear-gradient(90deg,#c0392b,#e05a48);box-shadow:0 2px 8px rgba(192,57,43,.25)}
@keyframes plpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.prod-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
.prod-lot{text-align:right;font-size:.92rem}
.prod-lot b{color:var(--bordeaux,#490F25)}
.prod-base{color:#9a8a82;font-size:.68rem}
.prod-card-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:.76rem;color:#9a8a82;margin-bottom:10px}
.prod-card-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:9px 11px;background:#fbf6ef;border-radius:11px;font-size:.78rem;color:#7a6a62;margin-bottom:10px}
.prod-card-stats b{color:var(--bordeaux,#490F25);font-size:.9rem;display:block}
.prod-unit{color:#9a8a82;font-size:.64rem}
.prod-loss{margin-bottom:8px}
.prod-card-status{margin-bottom:11px;font-size:.86rem}
.prod-card-actions{display:flex;gap:7px;flex-wrap:wrap;padding-top:11px;border-top:1px dashed #ece3d5}
.sum-box b{color:var(--bordeaux)}
/* HORODATEUR GLOBAL — discret, fixe en haut à droite, présent sur toutes les pages.
   Semi-transparent et non cliquable pour ne pas gêner ; passe sous les modales (z-index modéré). */
.clock{position:fixed;top:8px;right:12px;z-index:30;pointer-events:none;
  font-family:'Outfit',system-ui,sans-serif;font-size:.72rem;line-height:1.15;text-align:right;
  color:var(--bordeaux);opacity:.62;font-variant-numeric:tabular-nums;letter-spacing:.01em;
  background:rgba(253,251,247,.72);border:1px solid rgba(170,124,57,.18);border-radius:9px;
  padding:4px 9px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  box-shadow:0 1px 4px rgba(73,15,37,.06);user-select:none;max-width:46vw}
.clock .c-date{display:block;font-size:.66rem;color:#8a7a72;text-transform:capitalize}
.clock .c-time{display:block;font-weight:600;font-size:.82rem}
/* iPhone : laisse respirer sous l'encoche/barre d'état (safe-area) */
@supports(padding:max(0px)){ .clock{top:max(8px, env(safe-area-inset-top))} }
/* TABLEAU DE BORD — paire d'encarts (Matières à réappro / Prochaines échéances).
   2 colonnes quand il y a la place, 1 seule colonne dès que c'est étroit
   (auto-fit + minmax évite que les tableaux soient écrasés et coupés). */
.dash-2col{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
/* tableaux des deux encarts : la colonne « nom » peut revenir à la ligne
   au lieu de déborder ; les colonnes chiffres/tags restent sur une ligne. */
.dash-tbl{width:100%;table-layout:auto}
.dash-tbl td{padding:9px 8px;vertical-align:middle}
.dash-tbl td.nm{word-break:break-word;line-height:1.25;font-weight:500;color:var(--bordeaux)}
.dash-tbl tr+tr td{border-top:1px solid var(--hair)}
/* RACCOURCIS cliquables (comptabilité & co) : un chevron « › » caramel signale le lien.
   On ne souligne pas le chiffre ; on ajoute le marqueur à côté. */
.lnk{cursor:pointer;transition:.12s}
.lnk:hover,.lnk:active{filter:brightness(.98);background-image:linear-gradient(135deg,#f0e7d6,#e9dfcc)}
.kpi.lnk:hover,.kpi.lnk:active{border-color:var(--caramel);box-shadow:0 0 0 2px rgba(170,124,57,.18)}
.lnk .nav-go{color:var(--caramel);font-weight:700;font-size:1.05em;margin-left:7px;flex:none;line-height:1}
.info-i{color:var(--caramel);font-size:.82em;opacity:.7;margin-left:3px;font-weight:400}
.kpi.lnk{position:relative}
.kpi.lnk .nav-go{position:absolute;top:10px;right:12px;margin:0;font-size:1rem}
.cmd-line{border:1.5px solid #e0d5c5;border-radius:12px;padding:14px;margin-bottom:12px;background:#fff;position:relative}
.cmd-line .line-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cmd-line .line-type{font-family:'Fraunces',serif;font-weight:600;color:var(--bordeaux);font-size:.95rem}
.cmd-line .line-del{cursor:pointer;color:var(--red);font-weight:600;font-size:.8rem}
.cmd-line .line-sub{font-size:.74rem;color:#9a8a82;margin-left:8px;font-weight:400;font-family:'Outfit'}
.add-line-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.add-line-row .btn{flex:1;min-width:90px}
.flav-sel{width:60px;padding:5px;border:1px solid #e0d5c5;border-radius:7px;font-size:14px;background:#fff}
.trace-step{border-left:3px solid var(--caramel);padding:4px 0 4px 14px;margin-left:6px;position:relative}
.trace-step::before{content:'';position:absolute;left:-7px;top:10px;width:11px;height:11px;border-radius:50%;background:var(--caramel)}
.labels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.label{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;display:flex;gap:12px;align-items:center;page-break-inside:avoid;position:relative}
.label .qr{flex-shrink:0}
.label .qr canvas{display:block;width:84px;height:84px;image-rendering:pixelated}
.label .info{font-size:.8rem;line-height:1.5;min-width:0;display:flex;flex-direction:column;gap:1px;flex:1}
.label .info b{color:#000;font-family:'Outfit',sans-serif;font-size:.92rem;font-weight:700}
.label .info .meta{color:#333}
.label .label-print{flex-shrink:0}
.label .label-actions{flex-shrink:0;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.label .label-actions .copies{font-size:.74rem;color:#7a6a62;display:flex;align-items:center;gap:5px}
.label .label-actions .copies input{width:54px;padding:5px 7px;border:1.5px solid #e0d5c5;border-radius:8px;font-family:'Outfit'}
.act-status{cursor:pointer;display:inline-block}
@media print{
  .side,.topbar .flex,.banner,.toast,.label-actions{display:none!important}
  .main{margin-left:0!important;padding:0!important}
  .panel{box-shadow:none;border:none;padding:0}
  .label{border:1px solid #000}
  .labels-grid{grid-template-columns:repeat(2,1fr)}
}
/* ---- Pointeuse de laboratoire (time tracker global) ---- */
/* ===== POINTEUSE — feu tricolore flottant déplaçable + fouets animés ===== */
#timeTracker{display:none !important}
#timeTracker.legacy-show{position:fixed;z-index:46;left:246px;bottom:18px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:transparent;border:none;border-radius:18px;
  padding:0;box-shadow:none;
  font-family:'Outfit',system-ui,sans-serif;touch-action:none;user-select:none;cursor:grab;transition:gap .15s}
#timeTracker.dragging{cursor:grabbing;opacity:.92}
/* poignée + bouton historique masqués au repos, révélés quand déployé */
#timeTracker .tt-grip{font-size:.7rem;color:#8a7d70;letter-spacing:.15em;line-height:1;display:none;opacity:.7}
#timeTracker .tt-light{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;position:relative;transition:.15s;
  display:flex;align-items:center;justify-content:center;font-size:1.05rem}
#timeTracker .tt-light.green{background:radial-gradient(circle at 35% 30%,#7bd88f,#2e9c4d);box-shadow:0 3px 10px rgba(46,156,77,.5)}
#timeTracker .tt-light.green:active{transform:scale(.92)}
#timeTracker .tt-light.dim{background:#3a322c;box-shadow:inset 0 0 0 1px #4a403a;cursor:pointer;display:none}
#timeTracker .tt-light.dim span{opacity:.55}
/* état déployé : fond, poignée et 2e bouton visibles, feu agrandi */
#timeTracker.tt-open{background:#2c2420;border:2px solid #1c1714;padding:9px 8px;box-shadow:0 10px 30px rgba(0,0,0,.32)}
#timeTracker.tt-open .tt-grip{display:block}
#timeTracker.tt-open .tt-light{width:46px;height:46px;font-size:1.25rem}
#timeTracker.tt-open .tt-light.dim{display:flex}
#ttWhisks{position:fixed;z-index:45;left:300px;bottom:24px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#ttWhisks .tt-whisk{pointer-events:auto;display:flex;align-items:center;gap:8px;
  background:#fff;border:1px solid rgba(170,124,57,.25);border-left:4px solid var(--tt-col,#AA7C39);border-radius:13px;padding:6px 10px;
  box-shadow:0 6px 20px rgba(82,37,47,.2);font-family:'Outfit',system-ui,sans-serif;cursor:grab;touch-action:none}
#ttWhisks .tt-whisk.dragging{cursor:grabbing;opacity:.92}
#ttWhisks .tt-whisk.paused{opacity:.72}
#ttWhisks .whisk-ico{width:30px;height:24px;display:inline-block;transform-origin:50% 50%;animation:whiskBeat .9s ease-in-out infinite}
#ttWhisks .tt-whisk.paused .whisk-ico{animation:none;filter:grayscale(.6)}
@keyframes whiskBeat{0%,100%{transform:rotate(-9deg) translateY(0)}50%{transform:rotate(9deg) translateY(-1px)}}
#ttWhisks .whisk-lbl{font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:#9a8a82;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;align-self:center}
#ttWhisks .whisk-time{font-family:'Fraunces',serif;font-size:.95rem;font-weight:600;color:var(--bordeaux);font-variant-numeric:tabular-nums}
#ttWhisks .whisk-ctrl{display:none;align-items:center;gap:5px;margin-left:4px}
#ttWhisks .tt-whisk.open .whisk-ctrl{display:flex}
#ttWhisks .whisk-ctrl button{appearance:none;-webkit-appearance:none;border:none;cursor:pointer;
  width:30px;height:30px;border-radius:50%;color:#fff;font-size:.8rem;-webkit-tap-highlight-color:transparent}
#ttWhisks .whisk-ctrl .wc-pause{background:radial-gradient(circle at 35% 30%,#f5c45e,#d8932a)}
#ttWhisks .whisk-ctrl .wc-stop{background:radial-gradient(circle at 35% 30%,#ef7e6e,#c23a2a)}
@media(max-width:820px){
  #timeTracker{left:auto;right:12px;bottom:calc(78px + env(safe-area-inset-bottom))}
  #ttWhisks{left:12px;right:auto;bottom:calc(82px + env(safe-area-inset-bottom))}
}
}
/* ---- Module Préparation / Picking (gros blocs tactiles) ---- */
.pick-tabs{display:flex;gap:8px;margin-bottom:16px}
.pick-tabs button{flex:1;appearance:none;-webkit-appearance:none;cursor:pointer;border:1.5px solid #e0d5c5;
  background:#fff;color:var(--bordeaux);font-family:inherit;font-weight:600;font-size:.92rem;
  padding:13px;border-radius:12px;-webkit-tap-highlight-color:transparent}
.pick-tabs button.active{background:var(--bordeaux);color:var(--creme);border-color:var(--bordeaux)}
.pick-date{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pick-date input[type=date]{flex:1;min-width:160px;font-size:1rem;padding:12px;border:1.5px solid #e0d5c5;border-radius:12px;font-family:inherit}
/* Ligne de picking : un gros bloc tactile, rouge (à faire) → vert (fait) */
.pick-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:#fff;border:2px solid #f0cfc9;border-left:6px solid var(--red,#b04a3e);
  border-radius:14px;padding:16px 16px;margin-bottom:10px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:.15s;min-height:64px}
.pick-row:active{transform:scale(.99)}
.pick-row.done{border-color:#bfe0c8;border-left-color:var(--green,#3f7d52);background:#f3faf5}
.pick-check{width:30px;height:30px;border-radius:8px;border:2px solid var(--red,#b04a3e);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#fff;font-weight:700}
.pick-row.done .pick-check{background:var(--green,#3f7d52);border-color:var(--green,#3f7d52)}
.pick-main{flex:1;min-width:0}
.pick-name{font-size:1.08rem;font-weight:600;color:var(--ink);line-height:1.2}
.pick-row.done .pick-name{text-decoration:line-through;color:#8a9a8e}
.pick-sub{font-size:.8rem;color:#9a8a82;margin-top:2px}
.pick-qty{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:600;color:var(--bordeaux);flex-shrink:0}
.pick-row.done .pick-qty{color:var(--green,#3f7d52)}
.pick-zone-head{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--bordeaux);
  font-size:.92rem;margin:14px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--creme)}
.pick-scan{appearance:none;-webkit-appearance:none;border:1.5px solid #d9c8e0;background:#fff;color:#7a4b82;
  border-radius:10px;padding:8px 10px;font-size:1.05rem;cursor:pointer;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.pick-order-card{background:#fff;border-radius:16px;box-shadow:0 4px 20px var(--shadow);
  border:1px solid rgba(170,124,57,.12);padding:18px;margin-bottom:16px}
.pick-order-card.ready{border:2px solid var(--green,#3f7d52)}
.pick-order-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.pick-order-head h3{color:var(--bordeaux);font-size:1.15rem}
.pick-progress{height:8px;border-radius:5px;background:#f0eae0;overflow:hidden;margin-bottom:14px}
.pick-progress span{display:block;height:100%;background:var(--green,#3f7d52);transition:width .25s}
.pick-big-btn{width:100%;padding:16px;font-size:1rem;font-weight:700;border-radius:12px;border:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center;gap:8px}
.pick-big-btn.ready{background:var(--green,#3f7d52);color:#fff}
.pick-big-btn.wait{background:#f0eae0;color:#9a8a82}
/* ---- Assistant : jauge de sérénité + cartes anti-gaspi ---- */
.serenity{padding:18px}
.ser-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ser-title{font-weight:600;color:var(--bordeaux);font-size:1.05rem}
.ser-score{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem}
.ser-bar{position:relative;height:16px;border-radius:9px;background:#efe7da;overflow:hidden}
.ser-bar>span{display:block;height:100%;border-radius:9px;transition:width .5s ease}
.ser-bar>i{position:absolute;top:-3px;height:22px;width:3px;background:#2b1a1f;border-radius:2px;transition:left .5s ease}
.ser-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.82rem;color:#7a6a62;margin-top:8px}
.ser-markets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gaspi-card{background:#fff;border:1px solid rgba(170,124,57,.14);border-left:5px solid #d98324;
  border-radius:12px;padding:14px;margin-bottom:10px}
.gaspi-head{font-size:1rem;color:var(--ink);margin-bottom:4px}
.gaspi-body{font-size:.88rem;color:#6a5a52;line-height:1.4}
.gaspi-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
/* ---- Mascotte chat (reflet de la jauge de sérénité) ---- */
#mascot{position:fixed;right:12px;top:calc(46px + env(safe-area-inset-top,0px));z-index:47;
  width:83px;height:83px;background:transparent;border:none;
  filter:drop-shadow(0 5px 8px rgba(82,37,47,.28));
  cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;
  display:flex;align-items:center;justify-content:center;transition:opacity .2s,transform .12s;user-select:none;
  animation:macaronBob 3.4s ease-in-out infinite}
#mascot .mascot-face{width:78px;height:78px;pointer-events:none}
#mascot .mascot-badge{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
  font-size:.6rem;font-weight:700;color:#fff;background:var(--mascot-col,#3f7d52);border-radius:9px;
  padding:1px 6px;line-height:1.3;box-shadow:0 2px 6px rgba(0,0,0,.18);pointer-events:none;white-space:nowrap}
#mascot.dragging{cursor:grabbing;opacity:.55;transform:scale(1.05);animation:none}
#mascot:active{transform:scale(.96)}
/* léger flottement permanent (vivant) */
@keyframes macaronBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* tremblement en zone de stress */
#mascot.alarm{animation:mascotShake 2.4s ease-in-out infinite}
@keyframes mascotShake{0%,92%,100%{transform:translateX(0)}94%{transform:translateX(-2px)}96%{transform:translateX(2px)}98%{transform:translateX(-1px)}}
@media (prefers-reduced-motion: reduce){ #mascot.alarm,#mascot{animation:none} }
/* s'estompe quand l'utilisateur survole/approche pour ne pas gêner la lecture */
#mascot:hover{opacity:.35}
@media(max-width:820px){ #mascot{width:75px;height:75px;right:10px;top:calc(48px + env(safe-area-inset-top,0px))} #mascot .mascot-face{width:70px;height:70px} }
/* ---- HACCP / PMS : relevés de température ---- */
.pms-periode{display:flex;gap:8px;margin-bottom:14px}
.pms-periode button{flex:1;appearance:none;-webkit-appearance:none;cursor:pointer;border:1.5px solid #e0d5c5;
  background:#fff;color:var(--bordeaux);font-family:inherit;font-weight:600;font-size:.95rem;
  padding:12px;border-radius:12px;-webkit-tap-highlight-color:transparent}
.pms-periode button.active{background:var(--caramel);color:#fff;border-color:var(--caramel)}
.pms-eq{border:1.5px solid #ece2d4;border-radius:14px;padding:14px;margin-bottom:12px;background:#fff;transition:.15s}
.pms-eq.nc{border-color:var(--red,#b04a3e);background:#fdf3f2}
.pms-eq-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pms-eq-nom{font-weight:600;color:var(--ink);font-size:1.02rem}
.pms-eq-plage{font-size:.78rem;color:#9a8a82}
.pms-eq-row{display:flex;align-items:center;gap:10px}
.pms-temp-input{flex:1;font-size:1.6rem;font-weight:600;text-align:center;padding:12px;
  border:2px solid #e0d5c5;border-radius:12px;font-family:'Fraunces',serif;color:var(--bordeaux);width:100%}
.pms-eq.nc .pms-temp-input{border-color:var(--red,#b04a3e);color:var(--red,#b04a3e)}
.pms-unit{font-size:1.2rem;color:#9a8a82;font-weight:600}
.pms-corr{margin-top:10px}
.pms-corr label{display:block;font-size:.82rem;color:var(--red,#b04a3e);font-weight:600;margin-bottom:5px}
.pms-corr select{width:100%;padding:11px;border:1.5px solid var(--red,#b04a3e);border-radius:10px;
  font-family:inherit;font-size:.9rem;background:#fff;color:var(--ink)}
/* ---- CRM : cartes KPI client ---- */
.crm-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.crm-kpi{background:var(--creme-2,#F5F0E8);border-radius:12px;padding:12px 8px;text-align:center}
.crm-emo{font-size:1.3rem;line-height:1}
.crm-val{font-family:'Fraunces',serif;font-weight:600;color:var(--bordeaux);margin-top:4px;font-size:1.05rem;word-break:break-word;line-height:1.15}
.crm-lbl{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:#9a8a82;margin-top:3px}
/* ---- MRP : jauge de capacité ---- */
.mrp-gauge-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.85rem;color:#7a6a62;margin-bottom:8px}
.mrp-gauge{height:16px;border-radius:9px;background:#efe7da;overflow:hidden}
.mrp-gauge>span{display:block;height:100%;border-radius:9px;transition:width .4s ease}
/* ---- Optimisation des achats : cartes comparateur ---- */
.achat-card{background:#fff;border:1px solid rgba(170,124,57,.14);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(82,37,47,.05)}
.achat-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.achat-mat{font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem;color:var(--bordeaux)}
.achat-best{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  background:#eef6ee;border:1px solid #cfe6d3;border-radius:10px;padding:9px 11px;margin-bottom:6px}
.achat-best-sup{font-weight:600;color:var(--green,#3f7d52)}
.achat-best-prix{font-family:'Fraunces',serif;font-weight:600;color:var(--green,#3f7d52);white-space:nowrap}
.achat-alt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 11px;border-bottom:1px solid #f0e9dd}
.achat-alt-sup{color:#7a6a62;font-size:.9rem}
.achat-alt-prix{font-weight:600;white-space:nowrap}
.achat-eco{margin-top:9px;font-size:.85rem;color:#7a6a62;background:var(--creme,#F5F0E8);border-radius:8px;padding:7px 10px}
/* ---- Faisabilité de commande (verdict instantané) ---- */
.feasibility{border:1.5px solid;border-radius:12px;padding:11px 13px;margin:4px 0 12px}
.feas-msg{font-weight:600;font-size:.92rem;line-height:1.35}
.feas-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:#7a6a62;margin-top:6px}
/* ---- Éditeur de disponibilités ---- */
.avail-anchor{font-size:.82rem;color:#7a6a62;background:var(--creme,#F5F0E8);border-radius:8px;padding:7px 10px;margin-bottom:4px}
.avail-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.avail-row label{flex:0 0 78px;font-size:.85rem;color:#7a6a62;font-weight:600}
.avail-row input{flex:1;padding:9px 10px;border:1.5px solid #e0d5c5;border-radius:9px;font-family:inherit;font-size:.88rem}
/* ---- Filtre catégorie matières / emballages ---- */
.mat-cat-chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.mat-cat-chips button{appearance:none;-webkit-appearance:none;cursor:pointer;border:1.5px solid var(--hair);
  background:#fff;color:var(--bordeaux);font-family:inherit;font-weight:600;font-size:.85rem;
  padding:8px 14px;border-radius:20px;-webkit-tap-highlight-color:transparent;box-shadow:var(--sh-1);transition:.15s}
.mat-cat-chips button:hover{border-color:var(--caramel)}
.mat-cat-chips button.active{background:var(--grad-bordeaux);color:#fff;border-color:transparent}
.allergen-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.allergen-chip{appearance:none;-webkit-appearance:none;cursor:pointer;border:1.5px solid var(--hair);
  background:#fff;color:#8a7a72;font-family:inherit;font-weight:600;font-size:.8rem;
  padding:6px 12px;border-radius:18px;-webkit-tap-highlight-color:transparent;transition:.15s}
.allergen-chip.on{background:linear-gradient(135deg,#c0584a,#a8443a);color:#fff;border-color:transparent;box-shadow:var(--sh-1)}
/* ---- Bilan financier mensuel (stats) ---- */
.bilan-mois{border:1px solid #ece2d4;border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.bilan-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:1.02rem;color:var(--bordeaux)}
.bilan-row{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:3px 0;color:#6a5a52}
.bilan-net{border-top:1px dashed #d8cab8;margin-top:5px;padding-top:6px;font-weight:600;color:var(--ink)}
/* ---- Séparateurs temporels de la liste des commandes ---- */
.cmd-sep>td{padding:6px 0 2px !important;border:none}
.cmd-sep-in{background:var(--sep-col,#52252F);color:#fff;padding:9px 12px;border-radius:8px;
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cmd-sep-lbl{font-family:'Fraunces',serif;font-weight:600;font-size:1rem;letter-spacing:.01em}
.cmd-sep-meta{font-size:.78rem;opacity:.92}
.cmd-sep-week>td{padding:0 0 2px !important;border:none}
.cmd-sep-week-in{background:var(--creme,#F5F0E8);color:#7a6a62;padding:5px 12px;
  font-size:.78rem;font-weight:600;border-left:3px solid var(--caramel,#AA7C39);border-radius:0 6px 6px 0}
/* Repères mois/semaine DANS la cellule client (figée à gauche → restent visibles au scroll) */
.cmd-period-month{display:block;width:fit-content;color:#fff;font-family:'Fraunces',serif;font-weight:600;
  font-size:.82rem;padding:2px 9px;border-radius:7px;margin-bottom:5px}
.cmd-period-week{display:inline-block;color:#7a6a62;background:var(--creme,#F5F0E8);font-weight:600;
  font-size:.7rem;padding:1px 8px;border-radius:6px;margin:0 0 4px 5px;border-left:3px solid var(--caramel,#AA7C39)}
.table-wrap tr.cmd-new-month td{border-top:2px solid var(--caramel,#AA7C39)}
/* STOCK PAR PARFUM : pastilles colorées (couleurs identiques à la boutique) */
.flavor-stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px}
.flavor-stock{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--hair);
  border-radius:11px;background:#fff}
.flavor-stock .fs-pastille{width:20px;height:20px;border-radius:50%;flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.flavor-stock .fs-nom{flex:1;font-weight:600;font-size:.9rem;color:var(--bordeaux)}
.flavor-stock .fs-qte{font-size:1.05rem;color:var(--bordeaux)}
.flavor-stock.fs-empty{opacity:.5;background:#faf7f2}
.flavor-stock.clickable{cursor:pointer;transition:transform .1s,box-shadow .15s}
.flavor-stock.clickable:hover{box-shadow:0 4px 14px rgba(82,37,47,.14);transform:translateY(-1px)}
.flavor-stock.clickable:active{transform:scale(.98)}
.flavor-stock .fs-zero{color:#b0a193;font-weight:600}
/* ---- Mode discret : floutage des noms sensibles ---- */
.sheet-privacy{width:100%;margin-bottom:12px;appearance:none;-webkit-appearance:none;cursor:pointer;
  border:1.5px solid var(--bordeaux);background:#fff;color:var(--bordeaux);font-family:inherit;
  font-weight:600;font-size:.95rem;padding:11px;border-radius:12px;-webkit-tap-highlight-color:transparent}
.blur-name{filter:blur(5px);transition:filter .15s;user-select:none;cursor:pointer}
.blur-name:hover,.blur-name:active{filter:blur(0)}
.switch-row{display:flex;align-items:center;gap:8px;font-size:.9rem;color:#6a5a52;margin:8px 0;cursor:pointer}
.switch-row input{width:18px;height:18px}
/* ---- Recherche productions : chips emplacement ---- */
.prod-emp-chips{display:flex;gap:6px;flex-wrap:wrap}
.prod-emp-chips button{appearance:none;-webkit-appearance:none;cursor:pointer;border:1.5px solid #e0d5c5;
  background:#fff;color:var(--bordeaux);font-family:inherit;font-weight:600;font-size:.82rem;
  padding:6px 12px;border-radius:18px;-webkit-tap-highlight-color:transparent}
.prod-emp-chips button.clear{color:#9a8a82;border-style:dashed}
/* ---- Planification personnelle (ordonnancement) ---- */
.perso-day{border:1px solid #ece2d4;border-radius:10px;padding:8px;margin-bottom:8px}
.perso-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.perso-insights{margin:0;padding-left:18px}
.perso-insights li{margin:6px 0;line-height:1.4;font-size:.92rem;color:#4a3a32}
.perso-ev{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid #f0e8dc}
.perso-ev:last-child{border-bottom:none}
.perso-ev-time{flex:0 0 52px;font-weight:700;color:var(--bordeaux);font-size:.82rem;text-align:right;line-height:1.2}
.perso-ev-time span{font-weight:500;color:#9a8a82}
.perso-ev-lbl{font-weight:600;color:var(--ink,#3a2a22)}
.perso-ev-note{font-size:.82rem;color:#7a6a62;margin-top:3px;line-height:1.4}
/* ---- Popup localisation des macarons (assistant) ---- */
.loc-zone{border:1px solid #ece2d4;border-radius:10px;padding:8px 10px;margin-bottom:10px}
.loc-zone-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.loc-batch{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:6px 0;border-top:1px dashed #efe6d8}
.loc-batch:first-of-type{border-top:none}
.loc-batch-main{font-size:.9rem;color:var(--ink,#3a2a22);display:flex;gap:8px;align-items:center}
.loc-batch-sub{font-size:.76rem;color:#8a7a72;grid-column:1}
.loc-batch-qty{grid-row:1 / span 2;align-self:center;font-weight:700;color:var(--bordeaux);font-size:1.05rem}
.opt-table{display:flex;flex-direction:column;border:1px solid #e6dac8;border-radius:10px;overflow:hidden}
.opt-table .opt-row{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-top:1px solid #efe6d8;background:#fff}
.opt-table .opt-row:first-child{border-top:none}
.opt-table .opt-row:has(input:checked){background:#fbf4e7}
.opt-table .opt-row input{flex:none;width:18px;height:18px}
.opt-table .opt-ico{font-size:1.2rem;flex:none;width:24px;text-align:center}
.opt-table .opt-emp{color:#fff;border-radius:6px;padding:1px 8px;flex:none;font-size:.85rem}
.opt-table .opt-main{flex:1;font-size:.9rem;line-height:1.25}
.opt-table .opt-sub{color:#9a8a82;font-size:.76rem}
.toast{position:fixed;bottom:24px;right:24px;background:var(--grad-bordeaux);color:var(--creme);
  padding:13px 20px;border-radius:var(--r-md);font-size:.88rem;box-shadow:var(--sh-3);
  z-index:1200;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;max-width:80vw;border:1px solid rgba(198,151,79,.2)}
.toast.show{opacity:1;transform:translateY(0)}
/* Variante avec action (annulation rapide) : cliquable, discrète, au-dessus de la barre d'onglets */
.toast.with-action{display:flex;align-items:center;gap:14px;pointer-events:auto;background:var(--ink,#3a2a22)}
.toast.with-action .toast-msg{flex:1}
.toast.with-action .toast-undo{appearance:none;-webkit-appearance:none;background:var(--gold,#AA7C39);color:#fff;border:none;
  border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:.86rem}
@media(max-width:820px){
  /* iPhone : on masque la barre latérale, on utilise la tabbar + feuille menu */
  .side{display:none}
  /* iPhone : emplacement de batch réduit à sa LETTRE seule, centrée, couleur conservée */
  .emp-tag .emp-full{display:none}
  .emp-tag .emp-letter{display:inline-block;min-width:1.1em;text-align:center;font-weight:700}
  .emp-tag{padding:3px 9px;text-align:center}
  .main{margin-left:0;max-width:100%;width:100%;padding:46px 14px calc(80px + env(safe-area-inset-bottom))}
  .topbar h1{font-size:1.5rem}
  .row2,.row3{grid-template-columns:1fr}
  table{font-size:.82rem}td,th{padding:9px 7px}
  .modal{width:94vw;padding:20px;max-height:84vh}
  .labels-grid{grid-template-columns:1fr}
  .panel{padding:16px}
  /* Calendrier compact */
  .cal-grid{gap:3px}
  .cal-head{font-size:.58rem;padding:2px}
  .cal-cell{min-height:54px;padding:3px;border-radius:7px;font-size:.7rem}
  .cal-num{font-size:.72rem}
  .cal-ev{font-size:.56rem;padding:1px 3px}
}
/* La tabbar et la feuille ne s affichent que sur petit écran */
.tabbar,.sheet-overlay{display:none}
@media(max-width:820px){
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--grad-bordeaux);
    padding:7px 4px;padding-bottom:calc(7px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 24px rgba(82,37,47,.28);border-top:1px solid rgba(198,151,79,.25)}
  .tabbar button{flex:1;appearance:none;-webkit-appearance:none;background:transparent;border:none;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;
    color:rgba(232,221,205,.78);font-family:inherit;font-size:.6rem;font-weight:500;-webkit-tap-highlight-color:transparent;border-radius:13px;transition:.18s}
  .tabbar button *{pointer-events:none}
  .tabbar button .ico{font-size:1.3rem}
  /* Bouton Pointeuse : pastille verte (rappel du feu d'origine) avec triangle « play » */
  .tabbar button .ico.tt-play{width:26px;height:26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#7bd88f,#2e9c4d);
    box-shadow:0 2px 7px rgba(46,156,77,.45);
    display:flex;align-items:center;justify-content:center;position:relative;transition:transform .12s}
  .tabbar button .ico.tt-play::after{content:"";display:block;
    width:0;height:0;border-style:solid;border-width:5px 0 5px 8px;
    border-color:transparent transparent transparent #fff;margin-left:2px}
  .tabbar button#ttBtn:active .ico.tt-play{transform:scale(.9)}
  .tabbar button#ttBtn.active .ico.tt-play{box-shadow:0 2px 10px rgba(46,156,77,.6)}
  .tabbar button.active{background:linear-gradient(160deg,#fff,var(--creme));color:var(--bordeaux);font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.2)}
  .sheet-overlay{position:fixed;inset:0;background:rgba(43,26,31,.45);z-index:60;display:none;
    align-items:flex-end;backdrop-filter:blur(3px)}
  .sheet-overlay.show{display:flex}
  .sheet{background:var(--paper);width:100%;border-radius:22px 22px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));
    max-height:84vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(82,37,47,.3)}
  .sheet-grip{width:42px;height:5px;border-radius:3px;background:#d8c9b0;margin:8px auto 14px}
  /* Toast/undo remontés au-dessus de la barre d'onglets sur mobile (non invasif) */
  .toast{bottom:calc(72px + env(safe-area-inset-bottom));right:12px;left:auto}
  .toast.with-action{left:12px;right:12px;max-width:none;justify-content:space-between}
  .sheet h3{color:var(--bordeaux);font-size:1.2rem;margin-bottom:14px}
  .sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
  .sheet-grid button{appearance:none;-webkit-appearance:none;border:1.5px solid #e0d5c5;background:#fff;
    cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:12px;
    font-family:inherit;font-size:.86rem;color:var(--ink);text-align:left;-webkit-tap-highlight-color:transparent}
  .sheet-grid button *{pointer-events:none}
  .sheet-grid button .ico{font-size:1.1rem;color:var(--caramel);width:20px;text-align:center}
  .sheet-grid button.active{border-color:var(--caramel);background:var(--creme-2);font-weight:600}
  .sheet-data{display:flex;flex-direction:column;gap:8px}
  .sheet-data .btn{width:100%}
}
</style>
</head>
<body>
<!-- Horodateur global : date + heure en direct, fixe en haut à droite, sur toutes les pages. -->
<div id="clock" class="clock" aria-hidden="true"></div>
<div class="app">
  <aside class="side">
    <div class="brand">Sensations<br>Macarons<small>Pilotage</small></div>
    <div class="brand-rule"></div>
    <nav class="nav" id="nav">
      <button data-v="dash" class="active"><span class="ico">◷</span><span>Tableau de bord</span></button>
      <div class="sep">Quotidien</div>
      <button data-v="clients"><span class="ico">♣</span><span>Clients</span></button>
      <button data-v="commandes"><span class="ico">✎</span><span>Commandes</span></button>
      <button data-v="cal"><span class="ico">▦</span><span>Calendrier</span></button>
      <div class="sep">Production</div>
      <button data-v="fournisseurs"><span class="ico">⚑</span><span>Fournisseurs</span></button>
      <button data-v="matieres"><span class="ico">⬛</span><span>Matières & lots</span></button>
      <button data-v="recettes"><span class="ico">❀</span><span>Recettes (BOM)</span></button>
      <button data-v="productions"><span class="ico">⚙</span><span>Productions</span></button>
      <button data-v="stockparfums"><span class="ico">🍬</span><span>Stock par parfum</span></button>
      <button data-v="couts"><span class="ico">€</span><span>Coûts & prix</span></button>
      <button data-v="sauvegardes"><span class="ico">🛟</span><span>Sauvegarde &amp; sécurité</span></button>
      <button type="button" class="nav-adv-toggle" onclick="navAdvToggle()"><span class="ico adv-chev">▸</span><span>Avancé</span></button>
      <div class="nav-adv" id="navAdv">
        <button data-v="produits"><span class="ico">◫</span><span>Offre / Coffrets</span></button>
        <button data-v="achats"><span class="ico">🛒</span><span>Optimisation achats</span></button>
        <button data-v="picking"><span class="ico">📦</span><span>Préparation / Picking</span></button>
        <button data-v="mrp"><span class="ico">🏭</span><span>Plan de production</span></button>
        <button data-v="rentaparfum"><span class="ico">🎯</span><span>Rentabilité parfums</span></button>
        <button data-v="pilotage"><span class="ico">📈</span><span>Pilotage stratégique</span></button>
        <button data-v="stats"><span class="ico">📊</span><span>Statistiques</span></button>
        <button data-v="compta"><span class="ico">📒</span><span>Comptabilité</span></button>
        <button data-v="analyse"><span class="ico">🧭</span><span>Analyse &amp; Production</span></button>
        <button data-v="previsionnel"><span class="ico">🔮</span><span>Prévisionnel stocks</span></button>
        <button data-v="evenements"><span class="ico">🎉</span><span>Événements &amp; acomptes</span></button>
        <button data-v="marches"><span class="ico">⛺</span><span>Marchés</span></button>
        <button data-v="migration"><span class="ico">📥</span><span>Reprise / migration</span></button>
        <button data-v="assistant"><span class="ico">🤖</span><span>Assistant</span></button>
        <button data-v="pms"><span class="ico">🧼</span><span>HACCP / PMS</span></button>
        <button data-v="dlc"><span class="ico">⏰</span><span>Suivi DLC</span></button>
        <button data-v="tracabilite"><span class="ico">⊕</span><span>Traçabilité</span></button>
        <button data-v="etiquettes"><span class="ico">▤</span><span>Étiquettes QR</span></button>
      </div>
    </nav>
    <div class="side-foot">
      <span class="foot-help">Données sur cet appareil.<br>Exporte chaque semaine ↓</span>
      <button class="btn gold sm foot-btn" onclick="exportData()"><span class="ico" style="display:none">⬇</span>⬇ Exporter</button>
      <button class="btn ghost sm foot-btn" style="color:var(--creme);border-color:var(--creme)" onclick="document.getElementById('imp').click()"><span class="ico" style="display:none">⬆</span>⬆ Importer</button>
      <input type="file" id="imp" class="hide" accept=".json" onchange="importData(event)">
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
