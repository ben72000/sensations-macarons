<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostic exécution</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#faf6f0;color:#2b1a1f}
  h1{font-size:1.1rem;margin:0 0 12px}
  pre{background:#1c0c14;color:#f5e9d0;padding:12px;border-radius:10px;font-size:.74rem;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:8px 0}
  .step{font-size:.8rem;color:#7a6a62;margin:2px 0}
  .ok{color:#2f7d52;font-weight:600}
  .bad{color:#b04a3e;font-weight:600}
</style>
</head>
<body>
<h1>Diagnostic exécution app.js</h1>
<div id="steps"></div>
<pre id="log">Démarrage…</pre>

<script>
var logs = [];
var steps = document.getElementById('steps');
function L(m){ logs.push(m); document.getElementById('log').textContent = logs.join('\n'); }
function step(m, cls){ var d=document.createElement('div'); d.className='step '+(cls||''); d.textContent=m; steps.appendChild(d); }

// Capture TOUTES les erreurs d'exécution
window.onerror = function(msg, src, line, col, err){
  L('❌ ERREUR JS\n  message: ' + msg + '\n  fichier: ' + (src||'?').split('/').pop() + '\n  ligne: ' + line + ':' + col + (err && err.stack ? '\n  stack:\n' + err.stack : ''));
  step('❌ Crash détecté (voir encadré noir)', 'bad');
  return false;
};
window.addEventListener('unhandledrejection', function(e){
  L('❌ PROMESSE REJETÉE: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + (e.reason && e.reason.stack ? '\n' + e.reason.stack : ''));
});

// Charge les scripts un par un, dans l'ordre, en signalant chaque étape
var scripts = ['dexie.min.js','qr.min.js','app.js'];
var i = 0;
function loadNext(){
  if(i >= scripts.length){
    step('✓ Tous les scripts ont fini de charger sans erreur de syntaxe', 'ok');
    L('✅ Aucune erreur de chargement/syntaxe.\nSi l\'app reste blanche en vrai, le crash vient d\'une fonction de démarrage appelée par index.html (DOMContentLoaded). Envoie cette capture quand même.');
    return;
  }
  var name = scripts[i];
  step('Chargement de ' + name + '…');
  var s = document.createElement('script');
  s.src = name + '?diag=' + Date.now();
  s.onload = function(){ step('✓ ' + name + ' chargé', 'ok'); i++; loadNext(); };
  s.onerror = function(){ step('❌ Échec chargement ' + name, 'bad'); L('❌ Impossible de charger ' + name); i++; loadNext(); };
  document.body.appendChild(s);
}
loadNext();
</script>
</body>
</html>
