<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diag 6 — base stock</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#faf6f0;color:#2b1a1f}
h1{font-size:1.05rem;margin:0 0 12px}
pre{background:#1c0c14;color:#f5e9d0;padding:14px;border-radius:10px;font-size:.8rem;white-space:pre-wrap;word-break:break-word;line-height:1.5}
</style></head><body>
<h1>Diagnostic base — mouvements de stock</h1>
<pre id="log">Lecture en cours…</pre>
<script src="dexie.min.js"></script>
<script>
function L(m){ document.getElementById('log').textContent = m; }
(async function(){
  try{
    if(typeof Dexie === 'undefined'){ L('❌ dexie.min.js non chargé (vérifie qu\'il est dans le dossier)'); return; }
    const db = new Dexie('sensations_macarons');
    // On NE déclare PAS de schéma : on ouvre la base telle qu'elle existe sur l'appareil,
    // pour lire sa version réelle et ses tables réelles, sans rien modifier.
    await db.open();
    let out = '✓ Base ouverte\n';
    out += 'Version réelle de TA base : ' + db.verno + '\n';
    out += '(le code de l\'app monte jusqu\'à la version 23)\n\n';
    const names = db.tables.map(t=>t.name);
    out += 'Nombre de tables : ' + names.length + '\n';
    const hasSM = names.includes('stockMoves');
    out += hasSM ? '✓ table stockMoves PRÉSENTE\n' : '❌ table stockMoves ABSENTE → c\'est la cause du journal vide\n';
    if(hasSM){
      const n = await db.stockMoves.count();
      out += '\n📦 stockMoves : ' + n + ' mouvement(s)\n';
      if(n>0){
        const all = await db.stockMoves.toArray();
        out += 'Derniers mouvements :\n';
        all.slice(-5).reverse().forEach(m=>{ out += '  '+(m.ts||'').slice(0,16)+' | '+(m.type||'?')+' | '+(m.parfumNom||'?')+' | '+(m.sens<0?'-':'+')+m.qte+'\n'; });
      } else {
        out += '→ table présente mais vide.\n';
      }
    }
    out += '\n— Autres tables clés —\n';
    for(const t of ['productions','orders','stockMoves','planOverrides','rdRefs']){
      out += (names.includes(t)? '✓ ':'✗ ') + t + '\n';
    }
    L(out);
  }catch(e){
    L('Erreur : ' + (e && e.message ? e.message : e) + '\n\nSi le message parle de version, ferme COMPLÈTEMENT l\'app et réessaie.');
  }
})();
</script></body></html>
