<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diag 6 — base stock</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#faf6f0;color:#2b1a1f}
h1{font-size:1.05rem;margin:0 0 12px}
pre{background:#1c0c14;color:#f5e9d0;padding:14px;border-radius:10px;font-size:.8rem;white-space:pre-wrap;word-break:break-word;line-height:1.5}
</style></head><body>
<h1>Diagnostic base — mouvements de stock</h1>
<pre id="log">Lecture en cours…</pre>
<script>
function L(m){ document.getElementById('log').textContent = m; }
// Lecture DIRECTE via IndexedDB natif (n'utilise pas le dexie maison, donc pas de db.open).
(function(){
  // Ouvre SANS numéro de version : on récupère la version réelle telle quelle, sans rien migrer.
  const req = indexedDB.open('sensations_macarons');
  req.onerror = function(){ L('Erreur ouverture IndexedDB : ' + (req.error && req.error.message)); };
  req.onsuccess = function(){
    try{
      const idb = req.result;
      let out = '✓ Base ouverte (lecture seule)\n';
      out += 'Version réelle de TA base : ' + idb.version + '\n';
      out += '(le code de l\'app vise la version 23)\n\n';
      const stores = Array.from(idb.objectStoreNames);
      out += 'Nombre de tables : ' + stores.length + '\n';
      const hasSM = stores.includes('stockMoves');
      out += hasSM ? '✓ table stockMoves PRÉSENTE\n' : '❌ table stockMoves ABSENTE → cause du journal vide\n';
      // tables cles
      out += '\n— Tables clés —\n';
      ['productions','orders','stockMoves','planOverrides','rdRefs','rdPreps'].forEach(function(t){
        out += (stores.includes(t)?'✓ ':'✗ ') + t + '\n';
      });
      if(hasSM){
        const tx = idb.transaction('stockMoves','readonly');
        const st = tx.objectStore('stockMoves');
        const cr = st.count();
        cr.onsuccess = function(){
          out += '\n📦 stockMoves : ' + cr.result + ' mouvement(s)\n';
          if(cr.result>0){
            const ar = st.getAll();
            ar.onsuccess = function(){
              const all = ar.result || [];
              out += 'Derniers mouvements :\n';
              all.slice(-5).reverse().forEach(function(m){ out += '  '+String(m.ts||'').slice(0,16)+' | '+(m.type||'?')+' | '+(m.parfumNom||'?')+' | '+(m.sens<0?'-':'+')+m.qte+'\n'; });
              L(out);
            };
            ar.onerror = function(){ L(out + '\n(lecture détails impossible)'); };
          } else {
            out += '→ table présente mais VIDE.\n';
            L(out);
          }
        };
        cr.onerror = function(){ L(out + '\n(count impossible)'); };
      } else {
        L(out);
      }
    }catch(e){ L('Erreur lecture : ' + (e && e.message ? e.message : e)); }
  };
})();
</script></body></html>
