<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnostic démarrage réel</title>
<style>
  body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#faf6f0;color:#2b1a1f}
  h1{font-size:1.1rem;margin:0 0 4px}
  p.sub{margin:0 0 12px;font-size:.8rem;color:#7a6a62}
  button{font-size:.95rem;padding:10px 16px;border:none;border-radius:10px;background:#52252F;color:#fff;font-weight:600;margin-bottom:12px}
  pre{background:#1c0c14;color:#f5e9d0;padding:12px;border-radius:10px;font-size:.72rem;white-space:pre-wrap;word-break:break-word;min-height:120px}
  iframe{width:1px;height:1px;opacity:0;position:absolute;pointer-events:none}
</style>
</head>
<body>
<h1>Diagnostic démarrage réel</h1>
<p class="sub">Charge l'app dans un cadre invisible et capte tout ce qui s'affiche dans la console (erreurs avalées comprises).</p>
<button id="go">Lancer le test</button>
<pre id="log">Appuie sur « Lancer le test »…</pre>
<iframe id="frame"></iframe>

<script>
var logs = [];
function L(m){ logs.push(m); document.getElementById('log').textContent = logs.join('\n'); }

document.getElementById('go').addEventListener('click', function(){
  logs = []; L('Chargement de l\'app dans un cadre isolé…');
  var frame = document.getElementById('frame');

  // Recharge propre du cadre
  frame.src = 'about:blank';

  setTimeout(function(){
    var win = frame.contentWindow;

    // On intercepte console.error et console.warn DANS le cadre, avant de charger l'app
    frame.onload = function(){
      try {
        var w = frame.contentWindow;
        var origErr = w.console.error.bind(w.console);
        var origWarn = w.console.warn.bind(w.console);
        w.console.error = function(){ L('🔴 console.error: ' + Array.prototype.slice.call(arguments).map(stringify).join(' ')); origErr.apply(null, arguments); };
        w.console.warn  = function(){ L('🟡 console.warn: '  + Array.prototype.slice.call(arguments).map(stringify).join(' ')); origWarn.apply(null, arguments); };
        w.onerror = function(msg, src, line, col){ L('❌ ERREUR: ' + msg + ' @ ' + (src||'').split('/').pop() + ':' + line + ':' + col); return false; };
        w.addEventListener('unhandledrejection', function(e){ L('❌ PROMESSE REJETÉE: ' + stringify(e.reason)); });
        L('App chargée dans le cadre. Surveillance active 6 s…');
        // Après 6 s on regarde si le contenu s'est dessiné
        setTimeout(function(){
          try {
            var body = frame.contentDocument.body;
            var mainTxt = (body.innerText||'').trim();
            if(mainTxt.length < 5){
              L('\n⚠️ Le corps de l\'app est VIDE après 6 s → le rendu ne s\'est pas fait. La/les erreurs ci-dessus en sont la cause.');
            } else {
              L('\n✅ L\'app a affiché du contenu (' + mainTxt.length + ' caractères). Le démarrage fonctionne dans ce cadre.');
            }
          } catch(e){ L('Lecture du cadre impossible: ' + e.message); }
        }, 6000);
      } catch(e){ L('Interception impossible: ' + e.message); }
    };

    // On injecte l'app : on recharge index.html dans le cadre
    frame.src = 'index.html?diag=' + Date.now();
  }, 200);

  function stringify(x){
    try {
      if(x instanceof Error) return x.message + (x.stack ? '\n   ' + x.stack.split('\n').slice(0,3).join('\n   ') : '');
      if(typeof x === 'object') return JSON.stringify(x);
      return String(x);
    } catch(e){ return String(x); }
  }
});
</script>
</body>
</html>
