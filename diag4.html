<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diag 4 — erreur de rendu</title>
<style>
body{font-family:-apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#faf6f0;color:#2b1a1f}
h1{font-size:1.1rem;margin:0 0 4px}p.sub{margin:0 0 12px;font-size:.8rem;color:#7a6a62}
button{font-size:.95rem;padding:10px 16px;border:none;border-radius:10px;background:#52252F;color:#fff;font-weight:600;margin-bottom:12px}
pre{background:#1c0c14;color:#f5e9d0;padding:12px;border-radius:10px;font-size:.72rem;white-space:pre-wrap;word-break:break-word;min-height:140px}
iframe{width:1px;height:1px;opacity:0;position:absolute;pointer-events:none}
</style></head><body>
<h1>Diag 4 — détail de l'erreur de rendu</h1>
<p class="sub">Capture le message + la ligne exacte de l'erreur qui vide l'écran.</p>
<button id="go">Lancer le test</button>
<pre id="log">Appuie sur « Lancer le test »…</pre>
<iframe id="frame"></iframe>
<script>
var logs=[];function L(m){logs.push(m);document.getElementById('log').textContent=logs.join('\n');}
function dErr(x){try{
  if(x instanceof Error){return 'message: '+x.message+'\n  '+(x.stack||'').split('\n').slice(0,4).join('\n  ');}
  if(x&&typeof x==='object'){var s=[];for(var k in x){try{s.push(k+'='+x[k]);}catch(e){}}return s.join(', ')||JSON.stringify(x);}
  return String(x);
}catch(e){return String(x);}}
document.getElementById('go').addEventListener('click',function(){
  logs=[];L('Chargement de l\'app…');
  var frame=document.getElementById('frame');frame.src='about:blank';
  setTimeout(function(){
    frame.onload=function(){
      try{var w=frame.contentWindow;
        var oe=w.console.error.bind(w.console);
        w.console.error=function(){
          var parts=Array.prototype.slice.call(arguments).map(dErr);
          L('🔴 '+parts.join('\n  '));oe.apply(null,arguments);
        };
        w.onerror=function(msg,src,line,col,err){L('❌ '+msg+' @ '+(src||'').split('/').pop()+':'+line+':'+col+(err&&err.stack?'\n  '+err.stack.split('\n').slice(0,4).join('\n  '):''));return false;};
        w.addEventListener('unhandledrejection',function(e){L('❌ PROMESSE: '+dErr(e.reason));});
        L('Surveillance active 6 s…');
        setTimeout(function(){try{var b=frame.contentDocument.body;var t=(b.innerText||'').trim();L('\n'+(t.length<5?'⚠️ corps vide':'contenu: '+t.length+' car.'));}catch(e){}},6000);
      }catch(e){L('intercept ko: '+e.message);}
    };
    frame.src='index.html?diag='+Date.now();
  },200);
});
</script></body></html>
